    <text x="0" y="66" fill="url(#accentTitle)" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Screen Capture API, Framing &amp; Annotation Architecture</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">DisplayMedia stream capture, browser/OS window shadows, pixel redaction callouts, and raster canvas output.</text>
  </g>

