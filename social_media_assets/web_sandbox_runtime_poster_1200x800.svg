<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Outer Protective Frame -->
  <rect x="24" y="24" width="1152" height="752" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER REGION (Y: 44 to 125) -->
  <g transform="translate(50, 44)">
    <!-- Badge -->
    <rect width="320" height="22" rx="11" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="11" cy="11" r="4" fill="#00f2fe" />
    <text x="22" y="15" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">OMNITOOL HUB &#8226; GENERATORS</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">WEB SANDBOX &amp; BROWSER CODE PLAYGROUND RUNTIME</text>

    <!-- Subtitle -->
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">IFrame Origin Isolation, Sandbox Attribute Flags, PostMessage Bus, and AST Loop Guards</text>
  </g>

  <!-- TOP OVERVIEW REGION (Y: 135 to 295) -->
  <g transform="translate(50, 135)">
    <rect width="1100" height="155" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 32 L 0 32 Z" fill="#131a2c" />
    <text x="20" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">BROWSER CODE PLAYGROUND: SECURE IFRAME SANDBOX ARCHITECTURE</text>

    <!-- Communication Bridge Diagram -->
    <g transform="translate(30, 46)">
      <!-- Host Page -->
      <g transform="translate(0, 0)">
        <rect width="270" height="88" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="16" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Host Application (omnitool.app)</text>
        <text x="16" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="16" dy="0">&#8226; Monaco / CodeMirror editor state</tspan>
          <tspan x="16" dy="14">&#8226; AST loop guard instrumentation</tspan>
          <tspan x="16" dy="14">&#8226; Simulated console log stream UI</tspan>
        </text>
      </g>

      <!-- postMessage Arrow Right -->
      <g transform="translate(285, 14)">
        <rect width="140" height="26" rx="4" fill="#131a2c" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="70" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">postMessage(HTML,JS) &#8594;</text>
      </g>

      <!-- postMessage Arrow Left -->
      <g transform="translate(285, 48)">
        <rect width="140" height="26" rx="4" fill="#131a2c" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
        <text x="70" y="17" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">&#8592; postMessage(logs)</text>
      </g>

      <!-- Sandboxed IFrame -->
      <g transform="translate(440, 0)">
        <rect width="600" height="88" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" />
        <text x="16" y="22" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Isolated Sandbox IFrame (&lt;iframe sandbox="allow-scripts"&gt;)</text>
        <text x="16" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="16" dy="0">&#8226; Origin is strictly null &#8226; Cannot access parent cookies, tokens, or localStorage</tspan>
          <tspan x="16" dy="14">&#8226; Intercepts console.log/warn/error and routes output over postMessage bridge</tspan>
          <tspan x="16" dy="14">&#8226; Isolated DOM environment completely separated from host application memory</tspan>
        </text>
      </g>
    </g>
    
  </g>

  <!-- 3 CORE COLUMNS REGION (Y: 308 to 745) -->
  <!-- COLUMN 1 -->
  <g transform="translate(50, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#f43f5e" />
    <text x="32" y="23" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">IFRAME SECURITY BOUNDARIES</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. The sandbox Attribute Boundary</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">&lt;iframe sandbox="allow-scripts</text>
      <text x="10" y="60" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">                 allow-modals"&gt;</text>
      <text x="10" y="76" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Omit allow-same-origin to prevent token theft</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 110)">
      <text x="0" y="14" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Why allow-same-origin is Dangerous</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Combining allow-scripts with allow-same-origin</tspan>
        <tspan x="0" dy="13">allows executed user code to access parent cookies,</tspan>
        <tspan x="0" dy="13">localStorage, and remove its own sandbox flags!</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 190)">
      <text x="0" y="14" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Blocked Capabilities in Sandbox</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">&#8226; No top-level navigation: window.top.location blocked</tspan>
        <tspan x="0" dy="13">&#8226; No popups: window.open() blocked without flag</tspan>
        <tspan x="0" dy="13">&#8226; No downloads: prevented without allow-downloads</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 270)">
      <rect width="314" height="100" rx="8" fill="#131a2c" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#128737; The Origin: null Guarantee</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Sandboxed iframes run with origin: null.</tspan>
        <tspan x="12" dy="13">Browser Same-Origin Policy forbids null origins</tspan>
        <tspan x="12" dy="13">from reading any data on omnitool.app.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 2 -->
  <g transform="translate(425, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">POSTMESSAGE RPC &amp; CONSOLE</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Console Log Interception Proxy</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">const _log = console.log;</text>
      <text x="10" y="60" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">console.log = (...args) =&gt; {</text>
      <text x="10" y="76" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">  parent.postMessage({type:'LOG', args}, '*');</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 110)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Runtime Error Trapping</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">window.onerror and window.onunhandledrejection</tspan>
        <tspan x="0" dy="13">listen for uncaught script errors and promise crashes,</tspan>
        <tspan x="0" dy="13">sending stack traces to the simulated output drawer.</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 190)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Dynamic CDN Script Injection</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">User-selected libraries (Tailwind, React, Lodash)</tspan>
        <tspan x="0" dy="13">are injected via &lt;script src="..."&gt; tags before user</tspan>
        <tspan x="0" dy="13">code runs, ensuring global symbols are available.</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 270)">
      <rect width="314" height="100" rx="8" fill="#131a2c" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9881; Structured Clone Serialization</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Objects sent across postMessage must be serializable.</tspan>
        <tspan x="12" dy="13">Functions, DOM nodes, and circular references are</tspan>
        <tspan x="12" dy="13">sanitized to string representations before sending.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 3 -->
  <g transform="translate(800, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#34d399" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">INFINITE LOOP GUARDS &amp; AST</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. The Infinite Loop Freeze Problem</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Because JavaScript is single-threaded, a loop like</tspan>
        <tspan x="0" dy="13">while(true) freezes the browser tab completely.</tspan>
        <tspan x="0" dy="13">Users are forced to kill the entire browser process.</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. AST Loop Guard Instrumentation</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">let _c = 0;</text>
      <text x="10" y="60" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">while(cond) {</text>
      <text x="10" y="76" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">  if (++_c &gt; 50000) throw new Error("Loop limit");</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 180)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Execution Debouncing (300ms)</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Re-rendering the iframe on every keystroke causes</tspan>
        <tspan x="0" dy="13">flicker and battery drain. Debouncing delays execution</tspan>
        <tspan x="0" dy="13">until 300ms after the user finishes typing.</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 260)">
      <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#059669" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9733; DOM Element Recycling</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Instead of creating new &lt;iframe&gt; elements on each run</tspan>
        <tspan x="12" dy="13">(which leaks DOM memory), OmniTool re-writes</tspan>
        <tspan x="12" dy="13">the iframe srcdoc attribute, ensuring zero memory</tspan>
        <tspan x="12" dy="13">accumulation during extended coding sessions.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- FOOTER BRANDING (Y: 760) -->
  <text x="600" y="764" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">OMNITOOL HUB CLIENT-SIDE SUITE &#8226; 100% PRIVATE &#8226; ZERO DATA TRANSMISSION &#8226; WEB STANDARDS COMPLIANT</text>
</svg>