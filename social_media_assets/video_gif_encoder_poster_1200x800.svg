        <text x="14" y="24" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Canvas Rendering</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Pulls raw video frames into hidden OffscreenCanv</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">as buffers</text>
      </g>
