<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="140" r="180" fill="#ec4899" opacity="0.05" />
  <circle cx="1060" cy="180" r="200" fill="#8b5cf6" opacity="0.05" />

  <!-- Outer Cyber Border -->
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(50, 48)">
    <rect width="280" height="26" rx="13" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1" />
    <text x="140" y="17" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB • GIF COMPRESSION</text>
    <text x="0" y="66" fill="url(#accentTitle)" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Video Frame Extraction &amp; LZW GIF Encoding Pipeline</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Canvas frame decimation, palette color quantization, Floyd-Steinberg dithering, and LZW byte compression.</text>
  </g>

  <!-- 3-COLUMN ARCHITECTURE GRID (Y: 155 to 680) -->
  <g transform="translate(50, 155)">
