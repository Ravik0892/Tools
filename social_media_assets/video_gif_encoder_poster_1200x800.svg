        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Reduces 24-bit TrueColor (16.7M colors) to index</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">ed 8-bit palette</text>
      </g>
