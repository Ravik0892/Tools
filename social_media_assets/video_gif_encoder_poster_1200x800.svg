    <g transform="translate(0, 0)">
      <rect width="350" height="525" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
      <rect width="350" height="42" rx="12" fill="#131b2e" />
      <rect y="40" width="350" height="2" fill="#1e293b" />
      <circle cx="22" cy="21" r="5" fill="#ec4899" />
      <text x="36" y="25" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Frame Extraction &amp; Timing</text>

      
      <g transform="translate(18, 60)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">FPS Decimation</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Sample video at 10, 15, 24, or 30 FPS to balance</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5"> quality and file size</text>
      </g>
      <g transform="translate(18, 150)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Time Trimming</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Select exact start and end timestamps to avoid b</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">loated GIF files</text>
      </g>
