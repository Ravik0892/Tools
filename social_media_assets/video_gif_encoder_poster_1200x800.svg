        <text x="14" y="24" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Resolution Scaling</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Downscale 1080p video to 480p or 320p for optimi</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">zed web avatars</text>
      </g>
