        <text x="14" y="24" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Aspect Ratio Crop</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Square 1:1, Landscape 16:9, or custom crop bound</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">s</text>
      </g>
    </g>

