<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGradPL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="titleGradPL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <pattern id="gridPatternPL" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradPL)" />
  <rect width="1200" height="800" fill="url(#gridPatternPL)" />
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB &#8226; DATA ENGINEERING</text>

    <text x="0" y="66" fill="url(#titleGradPL)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">Data Pipeline &amp; ETL Architecture Master Reference</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Visual standard for 5-stage transformation pipelines, ETL vs ELT paradigms, map/filter/reduce operators, and idempotency.</text>
  </g>

  <!-- Top Hero: The 5-Stage Data Pipeline Architecture (Y: 155 to 295) -->
  <g transform="translate(50, 155)">
    <rect width="1100" height="140" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
    <text x="24" y="28" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">THE 5-STAGE STREAMING PIPELINE FLOW</text>

    <!-- Stage 1: Ingest -->
    <g transform="translate(24, 46)">
      <rect width="190" height="78" rx="6" fill="#131a2c" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. INGESTION</text>
      <text x="12" y="40" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">Raw JSON / CSV / API</text>
      <text x="12" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Streams &amp; file buffers.</text>
      <text x="12" y="70" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Unparsed strings.</text>
    </g>

    <text x="220" y="90" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">&#8594;</text>

    <!-- Stage 2: Validate -->
    <g transform="translate(240, 46)">
      <rect width="190" height="78" rx="6" fill="#131a2c" stroke="#fbbf24" stroke-width="1" />
      <text x="12" y="22" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. VALIDATION</text>
      <text x="12" y="40" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">Schema &amp; Type Check</text>
      <text x="12" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Discard malformed rows.</text>
      <text x="12" y="70" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Enforce nullability rules.</text>
    </g>

    <text x="436" y="90" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">&#8594;</text>

    <!-- Stage 3: Transform -->
    <g transform="translate(456, 46)">
      <rect width="190" height="78" rx="6" fill="#131a2c" stroke="#a855f7" stroke-width="1" />
      <text x="12" y="22" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. TRANSFORMATION</text>
      <text x="12" y="40" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">Map / Filter / Mask</text>
      <text x="12" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Case formats, PII scrub,</text>
      <text x="12" y="70" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">data enrichment &amp; joins.</text>
    </g>

    <text x="652" y="90" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">&#8594;</text>

    <!-- Stage 4: Verify -->
    <g transform="translate(672, 46)">
      <rect width="190" height="78" rx="6" fill="#131a2c" stroke="#34d399" stroke-width="1" />
      <text x="12" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">4. AUDIT &amp; TEST</text>
      <text x="12" y="40" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">Assertions &amp; Counts</text>
      <text x="12" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Row totals &amp; checksums.</text>
      <text x="12" y="70" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Compare input vs output.</text>
    </g>

    <text x="868" y="90" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">&#8594;</text>

    <!-- Stage 5: Output -->
    <g transform="translate(888, 46)">
      <rect width="190" height="78" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1" />
      <text x="12" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">5. SINK &amp; EXPORT</text>
      <text x="12" y="40" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">JSON / CSV / SQL</text>
      <text x="12" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Instant local download,</text>
      <text x="12" y="70" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">clipboard, or API dispatch.</text>
    </g>
  </g>

  <!-- 3 Reference Columns (Y: 310 to 730) -->
  <!-- Col 1: ETL vs ELT Comparison -->
  <g transform="translate(50, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#00f2fe" />
    <text x="32" y="23" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">ETL VS ELT PARADIGMS</text>

    <g transform="translate(18, 52)">
      <!-- ETL Card -->
      <g transform="translate(0, 0)">
        <rect width="314" height="150" rx="6" fill="#0369a1" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
        <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">ETL (Extract &#8594; Transform &#8594; Load)</text>
        <text x="12" y="38" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Data transformed in memory before storage.</text>
        <text x="12" y="56" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; High Privacy: Scrub PII before disk write.</text>
        <text x="12" y="74" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; OmniTool Hub Model: Pure in-browser pipeline.</text>
        <text x="12" y="92" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Zero server exposure; predictable schema.</text>
        <text x="12" y="118" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">Best for: Client apps, security, compliance</text>
      </g>

      <!-- ELT Card -->
      <g transform="translate(0, 165)">
        <rect width="314" height="150" rx="6" fill="#7e22ce" fill-opacity="0.15" stroke="#a855f7" stroke-width="1" />
        <text x="12" y="20" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">ELT (Extract &#8594; Load &#8594; Transform)</text>
        <text x="12" y="38" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Raw data loaded directly into data lake/warehouse.</text>
        <text x="12" y="56" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Transformations run via SQL queries (BigQuery).</text>
        <text x="12" y="74" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Flexible: Original raw data preserved for re-runs.</text>
        <text x="12" y="92" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Requires high-scale cloud compute infrastructure.</text>
        <text x="12" y="118" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">Best for: Enterprise analytics, big data warehouses</text>
      </g>
    </g>
  </g>

  <!-- Col 2: Pipeline Operators -->
  <g transform="translate(425, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">FUNCTIONAL PIPELINE OPERATORS</text>

    <g transform="translate(18, 52)">
      <!-- Map -->
      <g transform="translate(0, 0)">
        <rect width="314" height="58" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">map(fn) &#8212; 1:1 Projection</text>
        <text x="12" y="33" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">Transforms each item independently (e.g. trim</tspan>
          <tspan x="12" dy="13">whitespace, format emails, convert currency).</tspan>
        </text>
      </g>

      <!-- Filter -->
      <g transform="translate(0, 68)">
        <rect width="314" height="58" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">filter(predicate) &#8212; Selective Pass</text>
        <text x="12" y="33" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">Discards rows evaluating to false (e.g. status</tspan>
          <tspan x="12" dy="13">=== 'active', price &gt; 0, valid email regex).</tspan>
        </text>
      </g>

      <!-- FlatMap -->
      <g transform="translate(0, 136)">
        <rect width="314" height="58" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">flatMap(fn) &#8212; 1:N Explode</text>
        <text x="12" y="33" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">Unnests nested lists into flat individual rows</tspan>
          <tspan x="12" dy="13">(e.g. orders with items &#8594; itemized rows).</tspan>
        </text>
      </g>

      <!-- Reduce -->
      <g transform="translate(0, 204)">
        <rect width="314" height="58" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">reduce(fn, init) &#8212; N:1 Aggregate</text>
        <text x="12" y="33" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">Folds collection into a summary or single scalar</tspan>
          <tspan x="12" dy="13">(totals, group-by buckets, running metrics).</tspan>
        </text>
      </g>

      <!-- Deduplicate -->
      <g transform="translate(0, 272)">
        <rect width="314" height="58" rx="4" fill="#1e293b" />
        <text x="12" y="18" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">distinctBy(key) &#8212; Deduplication</text>
        <text x="12" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Filters out repeated entries using unique hash sets.</text>
      </g>
    </g>
  </g>

  <!-- Col 3: Production Engineering Rules -->
  <g transform="translate(800, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#10b981" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">RESILIENT PIPELINE PRINCIPLES</text>

    <g transform="translate(18, 52)">
      <!-- Principle 1: Idempotency -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">1. Pipeline Idempotency</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Re-running pipelines on identical input yields</tspan>
          <tspan x="0" dy="13">the same output with zero side effects (<tspan fill="#f8fafc">f(x)=f(x)</tspan>).</tspan>
        </text>
      </g>

      <!-- Principle 2: Immutability -->
      <g transform="translate(0, 75)">
        <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">2. Immutability of Raw Inputs</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Never mutate inputs in-place. Output new</tspan>
          <tspan x="0" dy="13">records for safe branching &amp; parallel jobs.</tspan>
        </text>
      </g>

      <!-- Principle 3: Backpressure -->
      <g transform="translate(0, 150)">
        <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">3. Backpressure &amp; Chunking</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">For large datasets (50k+ rows), stream records</tspan>
          <tspan x="0" dy="13">in batches via Workers to keep UI responsive.</tspan>
        </text>
      </g>

      <!-- Principle 4: Dead Letter Queue -->
      <g transform="translate(0, 235)">
        <rect width="314" height="88" rx="6" fill="#131a2c" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="20" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">&#9888; Dead Letter Queue (DLQ)</text>
        <text x="10" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="10" dy="0">Rather than aborting pipelines on bad records,</tspan>
          <tspan x="10" dy="13">shunt corrupt rows to DLQ and keep processing.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>