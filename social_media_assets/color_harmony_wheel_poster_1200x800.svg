<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="colorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="colorTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="30%" stop-color="#fb923c" />
      <stop offset="55%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#colorBg)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="160" cy="140" r="180" fill="#f43f5e" opacity="0.05" />
  <circle cx="1060" cy="180" r="200" fill="#38bdf8" opacity="0.05" />

  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB • DESIGN SYSTEM</text>
    <text x="0" y="66" fill="url(#colorTitle)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">Color Harmony &amp; Palette Theory Reference</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">The 6 fundamental color harmony formulas, angular relationships, and web accessibility contrast rules.</text>
  </g>

  <!-- 6 COLOR HARMONIES GRID (2 Rows of 3 Cards) (Y: 155 to 555) -->

  <!-- ROW 1 -->
  <!-- 1. COMPLEMENTARY -->
  <g transform="translate(50, 155)">
    <rect width="355" height="185" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 343 0 Q 355 0 355 12 L 355 36 L 0 36 Z" fill="#131b2e" />
    <circle cx="20" cy="18" r="4" fill="#f43f5e" />
    <text x="32" y="22" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">1. COMPLEMENTARY (180°)</text>
    
    <!-- Palette Swatches -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="155" height="42" rx="6" fill="#3b82f6" />
      <text x="77" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">#3B82F6</text>

      <rect x="165" y="0" width="155" height="42" rx="6" fill="#f97316" />
      <text x="242" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">#F97316</text>
    </g>

    <text x="18" y="116" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Exact Opposites on Color Wheel</text>
    <text x="18" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Maximum visual contrast &amp; energy.</text>
    <text x="18" y="156" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Best for: Primary buttons, CTAs, Hero accents.</text>
  </g>

  <!-- 2. ANALOGOUS -->
  <g transform="translate(422, 155)">
    <rect width="355" height="185" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 343 0 Q 355 0 355 12 L 355 36 L 0 36 Z" fill="#131b2e" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="32" y="22" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">2. ANALOGOUS (30° - 60°)</text>

    <!-- Palette Swatches -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="100" height="42" rx="6" fill="#06b6d4" />
      <text x="50" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">#06B6D4</text>

      <rect x="110" y="0" width="100" height="42" rx="6" fill="#3b82f6" />
      <text x="160" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">#3B82F6</text>

      <rect x="220" y="0" width="100" height="42" rx="6" fill="#8b5cf6" />
      <text x="270" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">#8B5CF6</text>
    </g>

    <text x="18" y="116" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Adjacent Neighbors on Color Wheel</text>
    <text x="18" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Peaceful, serene, and naturally cohesive.</text>
    <text x="18" y="156" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Best for: Clean dashboard cards, backgrounds.</text>
  </g>

  <!-- 3. TRIADIC -->
  <g transform="translate(794, 155)">
    <rect width="356" height="185" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 344 0 Q 356 0 356 12 L 356 36 L 0 36 Z" fill="#131b2e" />
    <circle cx="20" cy="18" r="4" fill="#fbbf24" />
    <text x="32" y="22" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">3. TRIADIC (120°)</text>

    <!-- Palette Swatches -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="100" height="42" rx="6" fill="#ef4444" />
      <text x="50" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">#EF4444</text>

      <rect x="110" y="0" width="100" height="42" rx="6" fill="#10b981" />
      <text x="160" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">#10B981</text>

      <rect x="220" y="0" width="100" height="42" rx="6" fill="#3b82f6" />
      <text x="270" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">#3B82F6</text>
    </g>

    <text x="18" y="116" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Equilateral Triangle (3 Even Points)</text>
    <text x="18" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Vibrant balance even when desaturated.</text>
    <text x="18" y="156" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Best for: Data visualization &amp; chart series.</text>
  </g>

  <!-- ROW 2 -->
  <!-- 4. SPLIT-COMPLEMENTARY -->
  <g transform="translate(50, 360)">
    <rect width="355" height="185" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 343 0 Q 355 0 355 12 L 355 36 L 0 36 Z" fill="#131b2e" />
    <circle cx="20" cy="18" r="4" fill="#a78bfa" />
    <text x="32" y="22" fill="#ddd6fe" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">4. SPLIT-COMPLEMENTARY (150°/210°)</text>

    <!-- Palette Swatches -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="100" height="42" rx="6" fill="#3b82f6" />
      <text x="50" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">#3B82F6</text>

      <rect x="110" y="0" width="100" height="42" rx="6" fill="#f59e0b" />
      <text x="160" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">#F59E0B</text>

      <rect x="220" y="0" width="100" height="42" rx="6" fill="#ea580c" />
      <text x="270" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">#EA580C</text>
    </g>

    <text x="18" y="116" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Base + Two Adjacent Opposites</text>
    <text x="18" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">High contrast with less tension than complementary.</text>
    <text x="18" y="156" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Best for: High-converting landing page themes.</text>
  </g>

  <!-- 5. TETRADIC -->
  <g transform="translate(422, 360)">
    <rect width="355" height="185" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 343 0 Q 355 0 355 12 L 355 36 L 0 36 Z" fill="#131b2e" />
    <circle cx="20" cy="18" r="4" fill="#34d399" />
    <text x="32" y="22" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">5. TETRADIC / RECTANGLE (90°)</text>

    <!-- Palette Swatches -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="75" height="42" rx="6" fill="#ec4899" />
      <text x="37" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">#EC4899</text>

      <rect x="82" y="0" width="75" height="42" rx="6" fill="#f59e0b" />
      <text x="119" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">#F59E0B</text>

      <rect x="164" y="0" width="75" height="42" rx="6" fill="#10b981" />
      <text x="201" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">#10B981</text>

      <rect x="246" y="0" width="75" height="42" rx="6" fill="#6366f1" />
      <text x="283" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">#6366F1</text>
    </g>

    <text x="18" y="116" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Two Complementary Pairs (4 Colors)</text>
    <text x="18" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Rich and versatile; pick 1 dominant color.</text>
    <text x="18" y="156" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Best for: Complex multi-category dashboards.</text>
  </g>

  <!-- 6. MONOCHROMATIC -->
  <g transform="translate(794, 360)">
    <rect width="356" height="185" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 344 0 Q 356 0 356 12 L 356 36 L 0 36 Z" fill="#131b2e" />
    <circle cx="20" cy="18" r="4" fill="#00f2fe" />
    <text x="32" y="22" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">6. MONOCHROMATIC (Single Hue)</text>

    <!-- Palette Swatches -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="75" height="42" rx="6" fill="#0c4a6e" />
      <text x="37" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">#0C4A6E</text>

      <rect x="82" y="0" width="75" height="42" rx="6" fill="#0284c7" />
      <text x="119" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">#0284C7</text>

      <rect x="164" y="0" width="75" height="42" rx="6" fill="#38bdf8" />
      <text x="201" y="26" fill="#0f172a" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">#38BDF8</text>

      <rect x="246" y="0" width="75" height="42" rx="6" fill="#bae6fd" />
      <text x="283" y="26" fill="#0f172a" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">#BAE6FD</text>
    </g>

    <text x="18" y="116" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Single Hue with Varying Tints/Shades</text>
    <text x="18" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Elegant, minimal, and impossible to clash.</text>
    <text x="18" y="156" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Best for: Clean SaaS applications &amp; modals.</text>
  </g>

  <!-- BOTTOM ACCESSIBILITY & CONTRAST RULES (Y: 565 to 745) -->
  <g transform="translate(50, 565)">
    <rect width="1100" height="180" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 36 L 0 36 Z" fill="#131b2e" />
    <circle cx="20" cy="18" r="4" fill="#10b981" />
    <text x="32" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">WCAG 2.2 WEB ACCESSIBILITY &amp; CONTRAST STANDARDS</text>

    <!-- 3 Contrast Standards -->
    <g transform="translate(20, 52)">
      <rect width="335" height="106" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="16" y="26" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">WCAG Level AA: 4.5:1</text>
      <text x="16" y="50" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Standard Body Text (&lt; 18pt / 24px)</text>
      <text x="16" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Minimum mandatory contrast ratio</text>
      <text x="16" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">between text and its background.</text>
    </g>

    <g transform="translate(380, 52)">
      <rect width="335" height="106" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="16" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">WCAG Large Text: 3:1</text>
      <text x="16" y="50" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Large Headlines (≥ 18pt or 14pt bold)</text>
      <text x="16" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Allowed for prominent titles, hero text,</text>
      <text x="16" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">and UI components / input borders.</text>
    </g>

    <g transform="translate(740, 52)">
      <rect width="340" height="106" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="16" y="26" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">WCAG Level AAA: 7:1</text>
      <text x="16" y="50" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Enhanced Accessibility Standard</text>
      <text x="16" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Best practice for government portals, legal</text>
      <text x="16" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">documents, and medical web apps.</text>
    </g>
  </g>
</svg>
