<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#FF33A8" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="300" cy="315" r="260" fill="#FF007A" opacity="0.15" filter="blur(70px)" />
  <circle cx="900" cy="315" r="260" fill="#00F2FE" opacity="0.12" filter="blur(70px)" />

  <!-- Center Card -->
  <g transform="translate(100, 90)">
    <rect width="1000" height="450" rx="36" fill="#0E131F" fill-opacity="0.85" stroke="#1E2638" stroke-width="2" />

    <g transform="translate(120, 110)">
      <!-- Icon -->
      <g transform="translate(0, 10) scale(9.5)">
        <path fill="none" stroke="url(#iconGradient)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#neonGlow)"
          d="M9.813 15.904L9 21L14.907 18M21 3L13.882 10.118M3 21L10.118 13.882M10.118 10.118L13.882 13.882M10.118 10.118L3 3M13.882 10.118L21 21" />
      </g>

      <!-- Main Title -->
      <text x="280" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="105" letter-spacing="-2px" fill="url(#textGradient)">OmniTool Hub</text>

      <!-- Subtitle -->
      <text x="285" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="28" letter-spacing="3px" fill="#94A3B8">ALL-IN-ONE DEVELOPER &amp; DESIGN UTILITIES</text>
    </g>
  </g>
</svg>
