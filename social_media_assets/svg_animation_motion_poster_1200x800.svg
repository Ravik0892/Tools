<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Outer Protective Frame -->
  <rect x="24" y="24" width="1152" height="752" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER REGION (Y: 44 to 125) -->
  <g transform="translate(50, 44)">
    <!-- Badge -->
    <rect width="320" height="22" rx="11" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="11" cy="11" r="4" fill="#00f2fe" />
    <text x="22" y="15" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">OMNITOOL HUB &#8226; GRAPHICS &amp; SCREEN STUDIO</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">SVG ANIMATION &amp; VECTOR MOTION ESSENTIALS</text>

    <!-- Subtitle -->
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Path Command Syntax, Stroke-Dashoffset Drawing, CSS Keyframes, and Easing Curves</text>
  </g>

  <!-- TOP OVERVIEW REGION (Y: 135 to 295) -->
  <g transform="translate(50, 135)">
    <rect width="1100" height="155" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 32 L 0 32 Z" fill="#131a2c" />
    <text x="20" y="21" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">SVG PATH COMMAND ANATOMY &amp; MOTION PRIMITIVES</text>

    <!-- Path Commands Grid -->
    <g transform="translate(30, 44)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="240" height="42" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">M x,y / m dx,dy</text>
        <text x="12" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">MoveTo (Lifts pen to start new subpath)</text>
      </g>

      <g transform="translate(260, 0)">
        <rect width="240" height="42" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">L x,y / l dx,dy</text>
        <text x="12" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">LineTo (Draws straight line to target)</text>
      </g>

      <g transform="translate(520, 0)">
        <rect width="240" height="42" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">H x / V y</text>
        <text x="12" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Horizontal &amp; Vertical straight lines</text>
      </g>

      <g transform="translate(780, 0)">
        <rect width="260" height="42" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Z / z</text>
        <text x="12" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">ClosePath (Connects to subpath start)</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 52)">
        <rect width="320" height="42" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">C x1,y1 x2,y2 x,y</text>
        <text x="12" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Cubic B&#233;zier (2 control handles + endpoint)</text>
      </g>

      <g transform="translate(340, 52)">
        <rect width="320" height="42" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Q x1,y1 x,y</text>
        <text x="12" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Quadratic Curve (1 shared control point)</text>
      </g>

      <g transform="translate(680, 52)">
        <rect width="360" height="42" rx="4" fill="#131a2c" />
        <text x="12" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">A rx,ry rot large,sweep x,y</text>
        <text x="12" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Elliptical Arc (Radii, angle, flags, endpoint)</text>
      </g>
    </g>
    
  </g>

  <!-- 3 CORE COLUMNS REGION (Y: 308 to 745) -->
  <!-- COLUMN 1 -->
  <g transform="translate(50, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#c084fc" />
    <text x="32" y="23" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PATH SYNTAX &amp; STROKE DRAW</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. The Self-Drawing Stroke Technique</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Calculates path length: const L = path.getTotalLength();</tspan>
        <tspan x="0" dy="13">Sets stroke-dasharray: L, stroke-dashoffset: L.</tspan>
        <tspan x="0" dy="13">Transitioning dashoffset &#8594; 0 visually "draws" path.</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Pure CSS Implementation</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">.line-draw {</text>
      <text x="10" y="60" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">  stroke-dasharray: 1000;</text>
      <text x="10" y="76" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">  animation: draw 2s ease-out forwards; }</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 180)">
      <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Dash Pattern Ratios</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">stroke-dasharray: 10 5 produces 10px dash,</tspan>
        <tspan x="0" dy="13">5px gap. Animating dashoffset creates flowing</tspan>
        <tspan x="0" dy="13">marching ants or pipeline circuit flows.</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 260)">
      <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#7e22ce" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9733; Shape Morphing Caveat</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Path morphing (animating d="...") requires both</tspan>
        <tspan x="12" dy="13">start and end shapes to have the exact same number</tspan>
        <tspan x="12" dy="13">and order of path command coordinates.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 2 -->
  <g transform="translate(425, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PERFORMANCE &amp; TRANSFORM</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. CSS vs SMIL vs Web Animations (WAAPI)</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">&#8226; CSS: Hardware-accelerated transforms &amp; opacity</tspan>
        <tspan x="0" dy="13">&#8226; SMIL (&lt;animate&gt;): Self-contained in SVG files</tspan>
        <tspan x="0" dy="13">&#8226; WAAPI: Precise JS control (play, pause, reverse)</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. GPU Compositor Performance Rule</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">Smooth 60/120fps: transform, opacity</text>
      <text x="10" y="60" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">Causes Layout Reflow: width, height, d</text>
      <text x="10" y="76" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">Causes Repaint: fill, stroke, stroke-width</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 180)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. SVG transform-origin Trap</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">By default, SVG elements rotate around (0,0) of</tspan>
        <tspan x="0" dy="13">the entire SVG canvas! To rotate in place, add:</tspan>
        <tspan x="0" dy="13"><tspan fill="#f8fafc">transform-box: fill-box; transform-origin: center;</tspan></tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 260)">
      <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#128640; will-change: transform Optimization</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Promotes vector layer to a dedicated GPU compositing</tspan>
        <tspan x="12" dy="13">plane. Prevents repeated rasterization on complex</tspan>
        <tspan x="12" dy="13">icons during scroll and hover animations.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 3 -->
  <g transform="translate(800, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#34d399" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">EASING &amp; MOTION DYNAMICS</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Cubic B&#233;zier Easing Timing Curves</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">ease-out: cubic-bezier(0, 0, 0.2, 1)</text>
      <text x="10" y="60" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">ease-in: cubic-bezier(0.4, 0, 1, 1)</text>
      <text x="10" y="76" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">spring: cubic-bezier(0.175, 0.885, 0.32, 1.275)</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 110)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Natural Motion Physics Principles</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">&#8226; Elements entering screen use ease-out (fast &#8594; stop)</tspan>
        <tspan x="0" dy="13">&#8226; Elements exiting screen use ease-in (slow &#8594; launch)</tspan>
        <tspan x="0" dy="13">&#8226; Linear easing looks robotic, unnatural for UI</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 190)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Continuous Loop &amp; Spin Animation</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">For spinners and radar rings, use linear infinite:</tspan>
        <tspan x="0" dy="13">@keyframes spin { 100% { transform: rotate(360deg); } }</tspan>
        <tspan x="0" dy="13">Set animation-timing-function: linear for constant rate.</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 270)">
      <rect width="314" height="100" rx="8" fill="#131a2c" stroke="#059669" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9881; prefers-reduced-motion Compliance</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Always support accessibility standards:</tspan>
        <tspan x="12" dy="13">@media (prefers-reduced-motion: reduce) {</tspan>
        <tspan x="12" dy="13">  * { animation-duration: 0.01ms !important; } }</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- FOOTER BRANDING (Y: 760) -->
  <text x="600" y="764" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">OMNITOOL HUB CLIENT-SIDE SUITE &#8226; 100% PRIVATE &#8226; ZERO DATA TRANSMISSION &#8226; WEB STANDARDS COMPLIANT</text>
</svg>