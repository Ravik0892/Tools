<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1A102D" />
      <stop offset="70%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#06080D" />
    </radialGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#FF33A8" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1080" height="1080" fill="url(#bgGlow)" />
  
  <!-- Subtle Pill Backdrop Card -->
  <rect x="80" y="80" width="920" height="920" rx="140" fill="#0E131F" fill-opacity="0.7" stroke="#1E2638" stroke-width="3" />

  <!-- Soft Ambient Glow -->
  <circle cx="540" cy="420" r="220" fill="#FF007A" opacity="0.18" filter="blur(50px)" />
  <circle cx="540" cy="680" r="200" fill="#00F2FE" opacity="0.12" filter="blur(50px)" />

  <!-- Stacked Icon (Top Centered) -->
  <g transform="translate(390, 230) scale(12.5)">
    <path fill="none" stroke="url(#iconGradient)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
      filter="url(#neonGlow)"
      d="M9.813 15.904L9 21L14.907 18M21 3L13.882 10.118M3 21L10.118 13.882M10.118 10.118L13.882 13.882M10.118 10.118L3 3M13.882 10.118L21 21" />
  </g>

  <!-- Brand Title Text -->
  <text x="540" y="660" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="92" letter-spacing="-2px" fill="url(#textGradient)">OmniTool Hub</text>

  <!-- Tagline / Sub-text -->
  <text x="540" y="740" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="32" letter-spacing="4px" fill="#94A3B8">DEVELOPER &amp; DESIGN UTILITIES</text>
</svg>
