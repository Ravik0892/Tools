<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="jwtTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Tech Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="200" cy="180" r="180" fill="#00f2fe" opacity="0.05" />
  <circle cx="600" cy="180" r="180" fill="#c084fc" opacity="0.05" />
  <circle cx="1000" cy="180" r="180" fill="#10b981" opacity="0.05" />

  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB • AUTHENTICATION GUIDE</text>
    <text x="0" y="66" fill="url(#jwtTitleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">JWT Token Anatomy &amp; Security Structure</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Deconstructing JSON Web Tokens: Header, Payload claims, Cryptographic Signatures &amp; Verification.</text>
  </g>

  <!-- ENCODED TOKEN BAR (Y: 155 to 220) -->
  <g transform="translate(50, 155)">
    <rect width="1100" height="64" rx="10" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <text x="20" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">RAW TOKEN:</text>
    <!-- Part 1: Header -->
    <text x="110" y="39" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9</text>
    <text x="382" y="39" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900">.</text>
    <!-- Part 2: Payload -->
    <text x="395" y="39" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">eyJzdWIiOiIxMjM0NTYiLCJ1c2VyIjoiQWxpY2UiLCJyb2xlIjoiYWRtaW4iLCJleHAiOjE3NDIwMDAwMDB9</text>
    <text x="940" y="39" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900">.</text>
    <!-- Part 3: Signature -->
    <text x="952" y="39" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">tjVA95OrM7E...</text>
  </g>

  <!-- 3 COLUMNS DECODED SECTION (Y: 235 to 555) -->
  <!-- 1. HEADER (CYAN) -->
  <g transform="translate(50, 235)">
    <rect width="355" height="320" rx="12" fill="#0d121f" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 343 0 Q 355 0 355 12 L 355 40 L 0 40 Z" fill="#0b1b28" />
    <circle cx="20" cy="20" r="5" fill="#00f2fe" />
    <text x="34" y="24" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">1. HEADER (Metadata)</text>

    <!-- Code Block -->
    <rect x="18" y="56" width="319" height="100" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="32" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">{</text>
    <text x="48" y="104" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">"alg"<tspan fill="#e2e8f0">: </tspan><tspan fill="#34d399">"HS256"</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="48" y="126" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">"typ"<tspan fill="#e2e8f0">: </tspan><tspan fill="#34d399">"JWT"</tspan></text>
    <text x="32" y="146" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">}</text>

    <!-- Descriptions -->
    <g transform="translate(18, 175)">
      <text x="0" y="14" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">• alg (Algorithm):</text>
      <text x="0" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Cryptographic signing cipher (HS256, RS256, ES256).</text>

      <text x="0" y="62" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">• typ (Type):</text>
      <text x="0" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Identifies the token as JSON Web Token format.</text>

      <text x="0" y="110" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">⚠️ Base64URL-encoded, NOT ENCRYPTED!</text>
      <text x="0" y="128" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Anyone can decode and read this object.</text>
    </g>
  </g>

  <!-- 2. PAYLOAD (PURPLE) -->
  <g transform="translate(422, 235)">
    <rect width="355" height="320" rx="12" fill="#0d121f" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 343 0 Q 355 0 355 12 L 355 40 L 0 40 Z" fill="#1b122c" />
    <circle cx="20" cy="20" r="5" fill="#c084fc" />
    <text x="34" y="24" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">2. PAYLOAD (Claims)</text>

    <!-- Code Block -->
    <rect x="18" y="56" width="319" height="120" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="32" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">{</text>
    <text x="48" y="98" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11">"sub"<tspan fill="#e2e8f0">: </tspan><tspan fill="#34d399">"123456"</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="48" y="118" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11">"user"<tspan fill="#e2e8f0">: </tspan><tspan fill="#34d399">"Alice"</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="48" y="138" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11">"role"<tspan fill="#e2e8f0">: </tspan><tspan fill="#34d399">"admin"</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="48" y="158" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11">"exp"<tspan fill="#e2e8f0">: </tspan><tspan fill="#f59e0b">1742000000</tspan></text>
    <text x="32" y="174" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">}</text>

    <!-- Descriptions -->
    <g transform="translate(18, 190)">
      <text x="0" y="14" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">• Registered Claims:</text>
      <text x="0" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">sub (Subject), iss (Issuer), aud (Audience)</text>
      <text x="0" y="50" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">exp (Expiration), iat (Issued At), nbf (Not Before)</text>

      <text x="0" y="78" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">• Custom Claims:</text>
      <text x="0" y="96" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Application data like user roles, permissions, scopes.</text>

      <text x="0" y="122" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">🚫 NEVER store passwords or API secrets here!</text>
    </g>
  </g>

  <!-- 3. SIGNATURE (EMERALD) -->
  <g transform="translate(794, 235)">
    <rect width="356" height="320" rx="12" fill="#0d121f" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 344 0 Q 356 0 356 12 L 356 40 L 0 40 Z" fill="#0c1f1c" />
    <circle cx="20" cy="20" r="5" fill="#10b981" />
    <text x="34" y="24" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="1">3. SIGNATURE (Tamper-Proof)</text>

    <!-- Code Block -->
    <rect x="18" y="56" width="320" height="90" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="80" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">HMACSHA256(</text>
    <text x="38" y="100" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10.5">base64UrlEncode(header) + "." +</text>
    <text x="38" y="120" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10.5">base64UrlEncode(payload),</text>
    <text x="38" y="140" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10.5">secret_or_private_key</text>
    <text x="26" y="140" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">)</text>

    <!-- Descriptions -->
    <g transform="translate(18, 168)">
      <text x="0" y="14" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">• Tamper Detection:</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">
        <tspan x="0" dy="0">If an attacker modifies the payload (e.g. "admin"),</tspan>
        <tspan x="0" dy="15">the cryptographic signature fails validation.</tspan>
      </text>

      <text x="0" y="66" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">• Verification Keys:</text>
      <text x="0" y="84" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Symmetric: Shared secret (HS256).</text>
      <text x="0" y="102" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Asymmetric: Private signs, Public verifies (RS256).</text>

      <text x="0" y="130" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">🔒 Guarantees sender authenticity.</text>
    </g>
  </g>

  <!-- BOTTOM RULES & FLOW (Y: 575 to 745) -->
  <g transform="translate(50, 575)">
    <rect width="1100" height="170" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 36 L 0 36 Z" fill="#131a2c" />
    <circle cx="20" cy="18" r="4" fill="#f59e0b" />
    <text x="32" y="22" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">JWT BEST PRACTICES &amp; SECURITY PROTOCOLS</text>

    <!-- 4 Chips -->
    <g transform="translate(20, 52)">
      <rect width="250" height="96" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="14" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">1. Short Lifespans (exp)</text>
      <text x="14" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Set access tokens to 15-60 mins.</text>
      <text x="14" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Use secure refresh tokens in</text>
      <text x="14" y="84" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11">HttpOnly SameSite cookies.</text>
    </g>

    <g transform="translate(290, 52)">
      <rect width="250" height="96" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="14" y="26" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">2. Always Verify 'alg'</text>
      <text x="14" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Prevent "alg: none" exploits.</text>
      <text x="14" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Hardcode the expected algorithm</text>
      <text x="14" y="84" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11">on your backend verification.</text>
    </g>

    <g transform="translate(560, 52)">
      <rect width="250" height="96" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="14" y="26" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">3. HTTPS Transmission</text>
      <text x="14" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Never transmit JWT over HTTP.</text>
      <text x="14" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Send in Authorization header:</text>
      <text x="14" y="84" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Bearer &lt;token&gt;</text>
    </g>

    <g transform="translate(830, 52)">
      <rect width="250" height="96" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="14" y="26" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">4. Client-Side Safety</text>
      <text x="14" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Avoid localStorage for tokens</text>
      <text x="14" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">vulnerable to XSS attacks.</text>
      <text x="14" y="84" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11">Inspect safely in OmniTool Hub.</text>
    </g>
  </g>
</svg>
