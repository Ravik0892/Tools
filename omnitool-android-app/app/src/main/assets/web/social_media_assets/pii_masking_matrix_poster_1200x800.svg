<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="titleGradP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <pattern id="gridPatternP" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradP)" />
  <rect width="1200" height="800" fill="url(#gridPatternP)" />
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB &#8226; DATA PRIVACY</text>

    <text x="0" y="66" fill="url(#titleGradP)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">PII Classification &amp; Anonymization Matrix</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">GDPR, HIPAA, and CCPA privacy standards for direct vs indirect identifiers, irreversible masking, and k-anonymity.</text>
  </g>

  <!-- Top Hero: The 4-Tier Privacy Spectrum (Y: 155 to 295) -->
  <g transform="translate(50, 155)">
    <rect width="1100" height="140" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
    <text x="24" y="28" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">THE PRIVACY TRANSFORMATION SPECTRUM (HIGHEST RISK &#8594; MAXIMUM SAFETY)</text>

    <g transform="translate(24, 46)">
      <!-- Tier 1: Cleartext -->
      <g transform="translate(0, 0)">
        <rect width="250" height="78" rx="6" fill="#3f0714" stroke="#f43f5e" stroke-width="1" />
        <text x="12" y="22" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">1. Cleartext PII (High Risk)</text>
        <text x="12" y="40" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10.5">"Jane Doe, 987-65-4321"</text>
        <text x="12" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Directly identifiable. Zero protection.</text>
        <text x="12" y="70" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Breach liability: Severe penalties.</text>
      </g>

      <text x="260" y="44" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">&#8594;</text>

      <!-- Tier 2: Pseudonymization -->
      <g transform="translate(280, 0)">
        <rect width="250" height="78" rx="6" fill="#451a03" stroke="#fbbf24" stroke-width="1" />
        <text x="12" y="22" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">2. Pseudonymization</text>
        <text x="12" y="40" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10.5">"UID_8f9c2e0b17"</text>
        <text x="12" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Replaced with token / salted HMAC.</text>
        <text x="12" y="70" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Reversible with secret lookup key.</text>
      </g>

      <text x="540" y="44" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">&#8594;</text>

      <!-- Tier 3: Masking & Generalization -->
      <g transform="translate(560, 0)">
        <rect width="250" height="78" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
        <text x="12" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">3. Generalization / Masking</text>
        <text x="12" y="40" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10.5">"Age 30-40, ZIP 941XX"</text>
        <text x="12" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Reduces granularity (k-anonymity).</text>
        <text x="12" y="70" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Prevents unique individual pinpointing.</text>
      </g>

      <text x="820" y="44" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">&#8594;</text>

      <!-- Tier 4: Redaction & Synthetic -->
      <g transform="translate(840, 0)">
        <rect width="210" height="78" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1" />
        <text x="12" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">4. Anonymization / Mock</text>
        <text x="12" y="40" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10.5">"[REDACTED]" / Fake</text>
        <text x="12" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Irreversible destruction.</text>
        <text x="12" y="70" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">GDPR scope ceases to apply.</text>
      </g>
    </g>
  </g>

  <!-- 3 Reference Columns (Y: 310 to 730) -->
  <!-- Col 1: Direct vs Indirect Identifiers -->
  <g transform="translate(50, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#f43f5e" />
    <text x="32" y="23" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">DIRECT VS INDIRECT IDENTIFIERS</text>

    <g transform="translate(18, 52)">
      <!-- Direct PII -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Direct Identifiers (Singular Match)</text>
        <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Identifies an individual alone without extra data:</text>
        <g transform="translate(0, 38)">
          <rect width="314" height="66" rx="6" fill="#131a2c" />
          <text x="10" y="18" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; Full Name / Maiden Name</text>
          <text x="10" y="34" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; Social Security No (SSN) / Passport</text>
          <text x="10" y="50" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; Phone Number, Personal Email Address</text>
        </g>
      </g>

      <!-- Indirect / Quasi Identifiers -->
      <g transform="translate(0, 126)">
        <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Indirect Identifiers (Quasi-PII)</text>
        <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Non-unique individually, but dangerous when linked:</text>
        <g transform="translate(0, 38)">
          <rect width="314" height="66" rx="6" fill="#131a2c" />
          <text x="10" y="18" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; Date of Birth (DOB) &amp; Exact Age</text>
          <text x="10" y="34" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; ZIP / Postal Code &amp; City</text>
          <text x="10" y="50" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; Gender, IP Address, Device Fingerprint</text>
        </g>
      </g>

      <!-- Sweeney re-identification finding -->
      <g transform="translate(0, 252)">
        <rect width="314" height="95" rx="8" fill="#131a2c" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="20" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">&#9888; Sweeney's 87% Re-identification Rule</text>
        <text x="10" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="10" dy="0">87% of US population is uniquely identified by just 3</tspan>
          <tspan x="10" dy="14">quasi-identifiers: <tspan fill="#f8fafc">5-digit ZIP + Gender + Date of Birth</tspan>.</tspan>
        </text>
        <text x="10" y="78" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Always generalize or perturb quasi-identifiers!</text>
      </g>
    </g>
  </g>

  <!-- Col 2: Obfuscation & Masking Patterns -->
  <g transform="translate(425, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#06b6d4" />
    <text x="32" y="23" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">MASKING &amp; REDACTION PATTERNS</text>

    <g transform="translate(18, 52)">
      <!-- Credit Card Mask -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">1. Format-Preserving Masking (PCI-DSS)</text>
        <rect x="0" y="22" width="314" height="40" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Input:  4532-8765-1092-3482</text>
        <text x="10" y="52" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">Output: 4532-****-****-3482 (BIN + Last 4)</text>
      </g>

      <!-- Email Mask -->
      <g transform="translate(0, 75)">
        <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">2. Partial Email Obfuscation</text>
        <rect x="0" y="22" width="314" height="40" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Input:  alexander.smith@gmail.com</text>
        <text x="10" y="52" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">Output: a*********h@g***l.com</text>
      </g>

      <!-- Phone Mask -->
      <g transform="translate(0, 150)">
        <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">3. Phone Number Redaction</text>
        <rect x="0" y="22" width="314" height="40" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Input:  +1 (555) 839-2049</text>
        <text x="10" y="52" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">Output: +1 (***) ***-2049</text>
      </g>

      <!-- Salted Hash -->
      <g transform="translate(0, 225)">
        <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">4. Salted Cryptographic Hashing</text>
        <rect x="0" y="22" width="314" height="40" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">HMAC-SHA256(Email, Secret_Pepper)</text>
        <text x="10" y="52" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">Allows joining logs without storing plaintext.</text>
      </g>

      <g transform="translate(0, 310)">
        <text x="0" y="14" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">&#8226; Omnitool Hub regex masking runs 100% in local memory buffer.</text>
      </g>
    </g>
  </g>

  <!-- Col 3: k-Anonymity & Differential Privacy -->
  <g transform="translate(800, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#8b5cf6" />
    <text x="32" y="23" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">MATHEMATICAL PRIVACY STANDARDS</text>

    <g transform="translate(18, 52)">
      <!-- k-Anonymity -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">1. k-Anonymity</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Every quasi-identifier combination in a dataset</tspan>
          <tspan x="0" dy="13">must match at least <tspan fill="#f8fafc">k</tspan> distinct individuals.</tspan>
        </text>
        <rect x="0" y="50" width="314" height="26" rx="4" fill="#131a2c" />
        <text x="10" y="67" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">If k=5: 5+ people share (Age 30, ZIP 941)</text>
      </g>

      <!-- l-Diversity -->
      <g transform="translate(0, 95)">
        <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">2. l-Diversity</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Extends k-anonymity: ensures sensitive fields</tspan>
          <tspan x="0" dy="13">(e.g. diagnoses) in each group have &#8805; <tspan fill="#f8fafc">l</tspan> distinct</tspan>
          <tspan x="0" dy="13">values to prevent homogeneity attacks.</tspan>
        </text>
      </g>

      <!-- Differential Privacy -->
      <g transform="translate(0, 190)">
        <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">3. &#949;-Differential Privacy</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Injects mathematical Laplacian noise so queries</tspan>
          <tspan x="0" dy="13">never reveal if an individual is in the dataset.</tspan>
        </text>
        <rect x="0" y="66" width="314" height="42" rx="4" fill="#131a2c" />
        <text x="10" y="82" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">Pr[M(D1) &#8712; S] &#8804; e^&#949; &#8226; Pr[M(D2) &#8712; S]</text>
        <text x="10" y="98" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Where &#949; (epsilon) represents privacy budget.</text>
      </g>
    </g>
  </g>
</svg>