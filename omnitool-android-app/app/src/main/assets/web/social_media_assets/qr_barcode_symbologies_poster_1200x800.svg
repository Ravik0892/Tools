        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Code 128 / 39</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">High-density alphanumeric barcodes for shipping </text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&amp; inventory</text>
      </g>
      <g transform="translate(18, 150)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">EAN-13 / UPC-A</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Global retail item symbologies with modulo-10 ch</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">ecksums</text>
      </g>
      <g transform="translate(18, 240)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Styling &amp; Gradients</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Artistic color gradients, dot styles, and embedd</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">ed logos</text>
      </g>
      <g transform="translate(18, 330)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Live Camera Scan</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">WebRTC video stream scanner powered by BarcodeDe</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">tector API</text>
      </g>
      <g transform="translate(18, 420)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Vector SVG Export</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Infinite resolution SVG and high-res 300 DPI PNG</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5"> export</text>
      </g>
