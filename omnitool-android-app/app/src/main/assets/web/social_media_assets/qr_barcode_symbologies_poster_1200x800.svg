        <text x="14" y="24" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Quiet Zone</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Mandatory 4-module blank margin surrounding the </text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">matrix</text>
      </g>
    </g>

    <!-- Column 2 -->
    <g transform="translate(375, 0)">
