<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="140" r="180" fill="#818cf8" opacity="0.05" />
  <circle cx="1060" cy="180" r="200" fill="#38bdf8" opacity="0.05" />

  <!-- Outer Cyber Border -->
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(50, 48)">
    <rect width="280" height="26" rx="13" fill="#818cf8" fill-opacity="0.1" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="140" y="17" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB • SYMBOLOGY &amp; SCANNING</text>
    <text x="0" y="66" fill="url(#accentTitle)" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">2D Symbology Matrix, QR Code &amp; Barcode Architecture</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Reed-Solomon error correction levels, mask patterns, UPC/EAN linear barcodes, and camera decoding.</text>
  </g>

  <!-- 3-COLUMN ARCHITECTURE GRID (Y: 155 to 680) -->
  <g transform="translate(50, 155)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <rect width="350" height="525" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
      <rect width="350" height="42" rx="12" fill="#131b2e" />
      <rect y="40" width="350" height="2" fill="#1e293b" />
      <circle cx="22" cy="21" r="5" fill="#818cf8" />
      <text x="36" y="25" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">QR Code 2D Architecture</text>

      
      <g transform="translate(18, 60)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Position Detection</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Finder patterns (3 outer corners) define orienta</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">tion</text>
      </g>
      <g transform="translate(18, 150)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Timing Patterns</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Alternating black/white modules clock the grid p</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">itch</text>
      </g>
      <g transform="translate(18, 240)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Alignment Patterns</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Corrects camera distortion on curved or angled s</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">urfaces</text>
      </g>
      <g transform="translate(18, 330)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Format Information</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Stores Error Correction level and masking algori</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">thm ID</text>
      </g>
      <g transform="translate(18, 420)">
