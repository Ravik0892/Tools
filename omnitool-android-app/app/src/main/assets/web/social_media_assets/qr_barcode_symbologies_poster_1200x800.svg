        <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Level H (High)</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">~30% data restoration — required when embedding </text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">logos in center</text>
      </g>
      <g transform="translate(18, 420)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Mask Evaluation</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">8 penalty-scored mask formulas prevent confusing</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5"> optical patterns</text>
      </g>
