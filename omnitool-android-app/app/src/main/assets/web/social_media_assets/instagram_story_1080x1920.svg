<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="60%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#05070C" />
    </radialGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#FF33A8" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#bgGlow)" />
  <rect width="1080" height="1920" fill="url(#grid)" />

  <!-- Glowing Orbs -->
  <circle cx="540" cy="700" r="350" fill="#FF007A" opacity="0.16" filter="blur(90px)" />
  <circle cx="540" cy="1200" r="300" fill="#00F2FE" opacity="0.12" filter="blur(90px)" />

  <!-- Center Card -->
  <g transform="translate(100, 420)">
    <rect width="880" height="1080" rx="60" fill="#0E131F" fill-opacity="0.8" stroke="#1E2638" stroke-width="3" />

    <!-- Icon -->
    <g transform="translate(290, 160) scale(12.5)">
      <path fill="none" stroke="url(#iconGradient)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)"
        d="M9.813 15.904L9 21L14.907 18M21 3L13.882 10.118M3 21L10.118 13.882M10.118 10.118L13.882 13.882M10.118 10.118L3 3M13.882 10.118L21 21" />
    </g>

    <!-- Main Title -->
    <text x="440" y="580" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="88" letter-spacing="-2px" fill="url(#textGradient)">OmniTool Hub</text>

    <!-- Subtitle -->
    <text x="440" y="660" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="28" letter-spacing="4px" fill="#94A3B8">DEVELOPER &amp; DESIGN UTILITIES</text>

    <!-- Features -->
    <g transform="translate(140, 750)">
      <rect width="600" height="70" rx="20" fill="#1A2234" stroke="#2D3748" stroke-width="1.5" />
      <text x="300" y="44" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="#38BDF8">🚀 50+ Free Web Tools</text>

      <rect y="95" width="600" height="70" rx="20" fill="#1A2234" stroke="#2D3748" stroke-width="1.5" />
      <text x="300" y="139" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="#EC4899">⚡ Fast &amp; Browser-Based</text>

      <rect y="190" width="600" height="70" rx="20" fill="#1A2234" stroke="#2D3748" stroke-width="1.5" />
      <text x="300" y="234" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="#A855F7">🔒 100% Secure &amp; Private</text>
    </g>
  </g>
</svg>
