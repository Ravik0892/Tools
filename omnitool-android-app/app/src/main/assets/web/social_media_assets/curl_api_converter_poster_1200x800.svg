<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="140" r="180" fill="#f59e0b" opacity="0.05" />
  <circle cx="1060" cy="180" r="200" fill="#38bdf8" opacity="0.05" />

  <!-- Outer Cyber Border -->
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(50, 48)">
    <rect width="280" height="26" rx="13" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    <text x="140" y="17" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB • API INTEGRATION</text>
    <text x="0" y="66" fill="url(#accentTitle)" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">HTTP Request Parsing &amp; Multi-Language Code Generation</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">cURL CLI flag decomposition into JavaScript Fetch, Python Requests, Axios, Go HTTP, and Rust reqwest.</text>
  </g>

  <!-- 3-COLUMN ARCHITECTURE GRID (Y: 155 to 680) -->
  <g transform="translate(50, 155)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <rect width="350" height="525" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
      <rect width="350" height="42" rx="12" fill="#131b2e" />
      <rect y="40" width="350" height="2" fill="#1e293b" />
      <circle cx="22" cy="21" r="5" fill="#f59e0b" />
      <text x="36" y="25" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">cURL Command Flag Decomposition</text>

      
      <g transform="translate(18, 60)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">-X, --request</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">HTTP Method (GET, POST, PUT, PATCH, DELETE, OPTI</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">ONS, HEAD)</text>
      </g>
      <g transform="translate(18, 150)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">-H, --header</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Headers (Authorization, Content-Type, Accept, Us</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">er-Agent)</text>
      </g>
      <g transform="translate(18, 240)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">-d, --data / -F</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Raw JSON, URL-encoded payload, or multipart form</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5"> boundary</text>
      </g>
      <g transform="translate(18, 330)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">-u, --user</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Basic Authentication translated into Base64 Auth</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">orization header</text>
      </g>
      <g transform="translate(18, 420)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">--compressed</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Requests gzip, deflate, or brotli content encodi</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">ngs</text>
      </g>
    </g>

    <!-- Column 2 -->
    <g transform="translate(375, 0)">
      <rect width="350" height="525" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
      <rect width="350" height="42" rx="12" fill="#131b2e" />
      <rect y="40" width="350" height="2" fill="#1e293b" />
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="25" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Multi-Language Target Engines</text>

      
      <g transform="translate(18, 60)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">JavaScript (Fetch)</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Modern async/await native browser API with Promi</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">ses</text>
      </g>
      <g transform="translate(18, 150)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Node.js (Axios)</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Production-ready Axios configuration with interc</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">eptor support</text>
      </g>
      <g transform="translate(18, 240)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Python (Requests)</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Idiomatic Python dictionary headers and `json=` </text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">or `data=`</text>
      </g>
      <g transform="translate(18, 330)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Go (net/http)</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Type-safe Go client, `http.NewRequestWithContext</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">` and defer close</text>
      </g>
      <g transform="translate(18, 420)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Rust (reqwest)</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Asynchronous Rust client syntax with serde_json </text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">serialization</text>
      </g>
    </g>

    <!-- Column 3 -->
    <g transform="translate(750, 0)">
      <rect width="350" height="525" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
      <rect width="350" height="42" rx="12" fill="#131b2e" />
      <rect y="40" width="350" height="2" fill="#1e293b" />
      <circle cx="22" cy="21" r="5" fill="#f59e0b" />
      <text x="36" y="25" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Security &amp; Token Best Practices</text>

      
      <g transform="translate(18, 60)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Env Var Templating</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Replaces sensitive Bearer tokens with `${API_KEY</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">}` placeholders</text>
      </g>
      <g transform="translate(18, 150)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Sanitized Output</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Escapes quotation marks, newlines, and special s</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">hell symbols</text>
      </g>
      <g transform="translate(18, 240)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Zero Network I/O</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Conversion executes completely in browser withou</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">t sending requests</text>
      </g>
      <g transform="translate(18, 330)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">Cookie Parsing</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Extracts `-b, --cookie` into structured headers </text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">or cookie jars</text>
      </g>
      <g transform="translate(18, 420)">
        <rect width="314" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">1-Click Copy</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Instant snippet copy for faster developer debugg</text>
        <text x="14" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">ing workflows</text>
      </g>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(50, 712)">
    <rect width="1100" height="42" rx="8" fill="#0d121f" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">OmniTool Hub Master Technical Reference</text>
    <text x="1080" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="end">✓ Zero-Transmission cURL Parser • 6 Idiomatic Code Targets • Environment Variable Secret Shield</text>
  </g>
</svg>