<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Outer Protective Frame -->
  <rect x="24" y="24" width="1152" height="752" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER REGION (Y: 44 to 125) -->
  <g transform="translate(50, 44)">
    <!-- Badge -->
    <rect width="320" height="22" rx="11" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="11" cy="11" r="4" fill="#00f2fe" />
    <text x="22" y="15" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">OMNITOOL HUB &#8226; WRITERS &amp; PARSERS</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">PDF TOOLBOX &amp; DOCUMENT TRANSFORMATION MATRIX</text>

    <!-- Subtitle -->
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Object Trees, Page Slicing, Merging, Rasterization DPI, and Lossless Compression</text>
  </g>

  <!-- TOP OVERVIEW REGION (Y: 135 to 295) -->
  <g transform="translate(50, 135)">
    <rect width="1100" height="155" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 32 L 0 32 Z" fill="#131a2c" />
    <text x="20" y="21" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">PDF OBJECT MODEL &amp; DOCUMENT TRANSFORMATION TREE</text>

    <!-- Hierarchy Node Tree -->
    <g transform="translate(35, 46)">
      <!-- Root Catalog -->
      <g transform="translate(0, 16)">
        <rect width="180" height="60" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
        <text x="90" y="26" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">1. Root / Catalog</text>
        <text x="90" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">&lt;&lt; /Type /Catalog /Pages &gt;&gt;</text>
      </g>

      <path d="M 180 46 L 220 46" stroke="#475569" stroke-width="2" />
      <polygon points="220,42 228,46 220,50" fill="#475569" />

      <!-- Pages Node -->
      <g transform="translate(230, 16)">
        <rect width="180" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="90" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">2. /Pages Tree</text>
        <text x="90" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">&lt;&lt; /Count N /Kids [...] &gt;&gt;</text>
      </g>

      <path d="M 410 46 L 450 46" stroke="#475569" stroke-width="2" />
      <polygon points="450,42 458,46 450,50" fill="#475569" />

      <!-- Page Dict -->
      <g transform="translate(460, 16)">
        <rect width="200" height="60" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
        <text x="100" y="26" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">3. /Page Dictionary</text>
        <text x="100" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">MediaBox [0 0 595 842]</text>
      </g>

      <path d="M 660 46 L 700 46" stroke="#475569" stroke-width="2" />
      <polygon points="700,42 708,46 700,50" fill="#475569" />

      <!-- Content Stream & Resources -->
      <g transform="translate(710, 16)">
        <rect width="320" height="60" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2" />
        <text x="160" y="26" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">4. /Contents &amp; /Resources</text>
        <text x="160" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">FlateStream (Operators) + XObjects (Images)</text>
      </g>
    </g>
    
  </g>

  <!-- 3 CORE COLUMNS REGION (Y: 308 to 745) -->
  <!-- COLUMN 1 -->
  <g transform="translate(50, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#c084fc" />
    <text x="32" y="23" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PAGE SLICE &amp; MERGE ENGINE</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Split &amp; Merge Object ID Mapping</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">When merging PDFs, conflicting object IDs (e.g. 5 0 R)</tspan>
        <tspan x="0" dy="13">must be renumbered sequentially. All indirect</tspan>
        <tspan x="0" dy="13">references are rewritten to preserve links.</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Cross-Reference (XRef) Table Rebuild</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Every PDF contains a byte-offset index table at</tspan>
        <tspan x="0" dy="13">the end of the file. Merging or page deletion</tspan>
        <tspan x="0" dy="13">recalculates byte positions for instant loading.</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 160)">
      <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Inherited Resources Resolution</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Pages often inherit font resources from parent</tspan>
        <tspan x="0" dy="13">/Pages nodes. Splitting pages clones required</tspan>
        <tspan x="0" dy="13">dictionaries so isolated pages render correctly.</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 240)">
      <rect width="314" height="130" rx="8" fill="#131a2c" stroke="#7e22ce" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9881; Page Rotation &amp; MediaBox Matrix</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Page orientation is controlled by /Rotate (0, 90,</tspan>
        <tspan x="12" dy="13">180, 270) and /MediaBox dimensions [x1 y1 x2 y2].</tspan>
        <tspan x="12" dy="13">Rotating modifies the dictionary tag without</tspan>
        <tspan x="12" dy="13">re-encoding pixel data, executing in 10ms.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 2 -->
  <g transform="translate(425, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">RASTERIZATION &amp; DPI</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. PDF Points to Pixel Resolution</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">PDF standard user space defines 72 points = 1 inch.</tspan>
        <tspan x="0" dy="13">To rasterize for web, PDF.js applies viewport</tspan>
        <tspan x="0" dy="13">scale factor: (DPI / 72) * base points.</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. DPI Output Tradeoff Matrix</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">72 DPI: 595x842 (Fast preview / thumbnail)</text>
      <text x="10" y="60" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">150 DPI: 1240x1754 (Web display standard)</text>
      <text x="10" y="76" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">300 DPI: 2480x3508 (Print / OCR quality)</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 180)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Format Conversion Selection</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">&#8226; WebP: 60&#8211;70% size reduction, best for web</tspan>
        <tspan x="0" dy="13">&#8226; PNG: Lossless 24-bit, best for text &amp; charts</tspan>
        <tspan x="0" dy="13">&#8226; JPEG: Lossy photo pages, smaller than PNG</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 260)">
      <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#128065; Canvas Alpha &amp; White Background</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">PDF pages have transparent default backgrounds.</tspan>
        <tspan x="12" dy="13">Exporting to PNG requires filling canvas with solid</tspan>
        <tspan x="12" dy="13">white (#ffffff) first to prevent dark backgrounds.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 3 -->
  <g transform="translate(800, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#34d399" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">OPTIMIZATION &amp; COMPRESSION</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Lossless FlateDecode Stream Deflate</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Recompresses content streams with zlib level 9.</tspan>
        <tspan x="0" dy="13">Eliminates uncompressed text chunks and whitespace</tspan>
        <tspan x="0" dy="13">without altering a single vector curve or word.</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Embedded Image Downsampling</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Scanned PDFs often hold bloated 600 DPI scans.</tspan>
        <tspan x="0" dy="13">Downsampling DCTDecode (JPEG) images to 150 DPI</tspan>
        <tspan x="0" dy="13">shrinks file size by 70&#8211;85% with zero visual loss.</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 160)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Metadata &amp; Unused Font Purge</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Strips heavy XML XMP metadata, edit histories,</tspan>
        <tspan x="0" dy="13">thumbnails, and unreferenced embedded fonts</tspan>
        <tspan x="0" dy="13">left behind from deleted previous pages.</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 240)">
      <rect width="314" height="130" rx="8" fill="#131a2c" stroke="#059669" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#128737; Privacy &amp; Sanitization Standard</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Deleting pages in Adobe Acrobat often leaves orphaned</tspan>
        <tspan x="12" dy="13">objects readable in raw text. OmniTool rebuilds the</tspan>
        <tspan x="12" dy="13">document tree from scratch, purging all hidden</tspan>
        <tspan x="12" dy="13">orphaned data permanently.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- FOOTER BRANDING (Y: 760) -->
  <text x="600" y="764" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">OMNITOOL HUB CLIENT-SIDE SUITE &#8226; 100% PRIVATE &#8226; ZERO DATA TRANSMISSION &#8226; WEB STANDARDS COMPLIANT</text>
</svg>