<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="titleGradC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <pattern id="gridPatternC" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradC)" />
  <rect width="1200" height="800" fill="url(#gridPatternC)" />
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB &#8226; CSS ARCHITECTURE</text>

    <text x="0" y="66" fill="url(#titleGradC)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">CSS Flexbox &amp; CSS Grid Layout Master Reference</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Visual cheat sheet for 1D axis alignment (Flexbox) vs 2D track grids, auto-fit/auto-fill rules, and template areas.</text>
  </g>

  <!-- Top Hero: 1D (Flex) vs 2D (Grid) Core Philosophy (Y: 155 to 295) -->
  <g transform="translate(50, 155)">
    <rect width="1100" height="140" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />

    <text x="24" y="28" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">1D AXIS-BASED (FLEXBOX) VS 2D TRACK-BASED (CSS GRID)</text>

    <!-- Flexbox Card -->
    <g transform="translate(24, 46)">
      <rect width="520" height="78" rx="8" fill="#0369a1" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
      <text x="16" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">FLEXBOX: One-Dimensional Layouts (Row OR Column)</text>
      <text x="16" y="44" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Content-out approach. Items define their size; container flows them along main axis.</text>
      <text x="16" y="62" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5">display: flex; justify-content: space-between; align-items: center;</text>
    </g>

    <!-- Grid Card -->
    <g transform="translate(560, 46)">
      <rect width="515" height="78" rx="8" fill="#7e22ce" fill-opacity="0.15" stroke="#a855f7" stroke-width="1" />
      <text x="16" y="24" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">CSS GRID: Two-Dimensional Layouts (Rows AND Columns)</text>
      <text x="16" y="44" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Container-in approach. Strict coordinates; items snap into intersecting cells &amp; tracks.</text>
      <text x="16" y="62" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10.5">grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;</text>
    </g>
  </g>

  <!-- 3 Reference Columns (Y: 310 to 730) -->
  <!-- Col 1: Flexbox Axes & Alignment -->
  <g transform="translate(50, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">FLEXBOX ALIGNMENT &amp; SIZING</text>

    <g transform="translate(18, 52)">
      <!-- justify-content -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">justify-content (Main Axis)</text>
        <rect x="0" y="22" width="314" height="66" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; flex-start | center | flex-end</text>
        <text x="10" y="54" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; space-between | space-around</text>
        <text x="10" y="70" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; space-evenly (Equal gaps on all sides)</text>
      </g>

      <!-- align-items -->
      <g transform="translate(0, 102)">
        <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">align-items (Cross Axis)</text>
        <rect x="0" y="22" width="314" height="52" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; stretch (Default: fills cross-axis)</text>
        <text x="10" y="54" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; center | flex-start | baseline</text>
      </g>

      <!-- flex shorthand -->
      <g transform="translate(0, 190)">
        <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">flex: [grow] [shrink] [basis]</text>
        <rect x="0" y="22" width="314" height="74" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10.5">flex: 1 1 auto;  /* Responsive grow/shrink */</text>
        <text x="10" y="54" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5">flex: 0 0 250px; /* Fixed rigid width */</text>
        <text x="10" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">flex: 1 0 0;    /* Equal distribution */</text>
      </g>

      <g transform="translate(0, 290)">
        <rect width="314" height="58" rx="6" fill="#1e293b" />
        <text x="10" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Auto Margins in Flexbox</text>
        <text x="10" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">margin-left: auto; /* Pushes item to far right */</text>
      </g>
    </g>
  </g>

  <!-- Col 2: CSS Grid Tracks & Auto-fit -->
  <g transform="translate(425, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#a855f7" />
    <text x="32" y="23" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">GRID TRACKS &amp; AUTO-FIT MAGIC</text>

    <g transform="translate(18, 52)">
      <!-- The Holy Grail auto-fit formula -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Zero-Media-Query Responsive Columns</text>
        <rect x="0" y="22" width="314" height="66" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">grid-template-columns: repeat(</text>
        <text x="24" y="52" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">auto-fit, minmax(260px, 1fr)</text>
        <text x="10" y="66" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">);</text>
      </g>

      <!-- auto-fit vs auto-fill -->
      <g transform="translate(0, 102)">
        <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">auto-fit vs auto-fill</text>
        <rect x="0" y="22" width="314" height="74" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; auto-fit:</text>
        <text x="75" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Collapses empty tracks (items stretch)</text>
        <text x="10" y="58" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; auto-fill:</text>
        <text x="75" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Preserves empty tracks (items stay min size)</text>
      </g>

      <!-- fr unit -->
      <g transform="translate(0, 210)">
        <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">The Fractional Unit (1fr)</text>
        <rect x="0" y="22" width="314" height="52" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">1fr = 1 fraction of free available space</text>
        <text x="10" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">250px 1fr 2fr &#8594; Fixed sidebar + 1:2 split</text>
      </g>

      <!-- Alignment in Grid -->
      <g transform="translate(0, 296)">
        <rect width="314" height="52" rx="6" fill="#1e293b" />
        <text x="10" y="20" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Single Line Perfect Centering in Grid</text>
        <text x="10" y="38" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5">place-items: center; /* Horiz + Vert */</text>
      </g>
    </g>
  </g>

  <!-- Col 3: When to Use Which Decision Matrix -->
  <g transform="translate(800, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#10b981" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">DECISION MATRIX: FLEX VS GRID</text>

    <g transform="translate(18, 52)">
      <!-- When to pick Flexbox -->
      <g transform="translate(0, 0)">
        <rect width="314" height="135" rx="6" fill="#0369a1" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
        <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">&#10003; CHOOSE FLEXBOX WHEN:</text>
        <text x="12" y="40" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Building navigation bars, tabs, or toolbars.</text>
        <text x="12" y="58" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Elements flow primarily in 1 direction.</text>
        <text x="12" y="76" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Item sizes should adapt to their text content.</text>
        <text x="12" y="94" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Vertically centering a single element.</text>
        <text x="12" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Example: Button icon + label alignment.</text>
      </g>

      <!-- When to pick CSS Grid -->
      <g transform="translate(0, 150)">
        <rect width="314" height="135" rx="6" fill="#7e22ce" fill-opacity="0.15" stroke="#a855f7" stroke-width="1" />
        <text x="12" y="20" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">&#10003; CHOOSE CSS GRID WHEN:</text>
        <text x="12" y="40" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Overall page layout (Header, Sidebar, Main).</text>
        <text x="12" y="58" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Responsive product/card grids without media queries.</text>
        <text x="12" y="76" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Elements need alignment in both rows &amp; columns.</text>
        <text x="12" y="94" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&#8226; Layering items on top of each other (hero banners).</text>
        <text x="12" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Example: Dashboard widgets &amp; galleries.</text>
      </g>

      <!-- Hybrid Pro Tip -->
      <g transform="translate(0, 298)">
        <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9733; The Pro Pattern: Grid on Outside, Flex Inside</text>
        <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Use CSS Grid for the master 2D page card grid,</tspan>
          <tspan x="0" dy="14">and Flexbox inside cards to align items &amp; buttons.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>