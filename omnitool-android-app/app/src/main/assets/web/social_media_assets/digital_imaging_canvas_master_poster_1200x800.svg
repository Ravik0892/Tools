<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Outer Protective Frame -->
  <rect x="24" y="24" width="1152" height="752" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER REGION (Y: 44 to 125) -->
  <g transform="translate(50, 44)">
    <!-- Badge -->
    <rect width="320" height="22" rx="11" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="11" cy="11" r="4" fill="#00f2fe" />
    <text x="22" y="15" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">OMNITOOL HUB &#8226; GRAPHICS &amp; SCREEN STUDIO</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">DIGITAL IMAGING &amp; CANVAS COMPOSITION STUDIO</text>

    <!-- Subtitle -->
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">HTML5 Canvas 2D Context, Affine Matrices, Porter-Duff Blend Modes, and Pixel Kernels</text>
  </g>

  <!-- TOP OVERVIEW REGION (Y: 135 to 295) -->
  <g transform="translate(50, 135)">
    <rect width="1100" height="155" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 32 L 0 32 Z" fill="#131a2c" />
    <text x="20" y="21" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">HTML5 2D CANVAS RENDERING &amp; COMPOSITING PIPELINE</text>

    <!-- 4 Pipeline Stages -->
    <g transform="translate(24, 46)">
      <!-- Stage 1 -->
      <g transform="translate(0, 0)">
        <rect width="240" height="92" rx="8" fill="#131a2c" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="20" cy="20" r="10" fill="#be185d" />
        <text x="20" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">1</text>
        <text x="38" y="24" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Vector / Bitmap Input</text>
        <text x="12" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">&#8226; Path2D vector shapes &amp; text</tspan>
          <tspan x="12" dy="14">&#8226; ImageBitmaps &amp; video frames</tspan>
          <tspan x="12" dy="14">&#8226; Linear &amp; radial gradients</tspan>
        </text>
      </g>

      <polygon points="268,42 276,46 268,50" fill="#475569" />

      <!-- Stage 2 -->
      <g transform="translate(284, 0)">
        <rect width="240" height="92" rx="8" fill="#131a2c" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="20" cy="20" r="10" fill="#0369a1" />
        <text x="20" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">2</text>
        <text x="38" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Affine Matrix Transform</text>
        <text x="12" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">&#8226; CTM 3x3 2D affine matrix</tspan>
          <tspan x="12" dy="14">&#8226; ctx.translate(x, y) &amp; rotate(&#952;)</tspan>
          <tspan x="12" dy="14">&#8226; HiDPI window.devicePixelRatio</tspan>
        </text>
      </g>

      <polygon points="532,42 540,46 532,50" fill="#475569" />

      <!-- Stage 3 -->
      <g transform="translate(548, 0)">
        <rect width="240" height="92" rx="8" fill="#131a2c" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="20" cy="20" r="10" fill="#6b21a8" />
        <text x="20" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">3</text>
        <text x="38" y="24" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Porter-Duff Compositing</text>
        <text x="12" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">&#8226; globalCompositeOperation</tspan>
          <tspan x="12" dy="14">&#8226; Clipping mask (destination-in)</tspan>
          <tspan x="12" dy="14">&#8226; Blend modes (multiply, overlay)</tspan>
        </text>
      </g>

      <polygon points="796,42 804,46 796,50" fill="#475569" />

      <!-- Stage 4 -->
      <g transform="translate(812, 0)">
        <rect width="240" height="92" rx="8" fill="#131a2c" stroke="#34d399" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="20" cy="20" r="10" fill="#047857" />
        <text x="20" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">4</text>
        <text x="38" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Pixel Buffer Output</text>
        <text x="12" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">&#8226; Uint8ClampedArray RGBA</tspan>
          <tspan x="12" dy="14">&#8226; Convolution matrix filter math</tspan>
          <tspan x="12" dy="14">&#8226; toBlob(PNG/JPEG/WebP)</tspan>
        </text>
      </g>
    </g>
    
  </g>

  <!-- 3 CORE COLUMNS REGION (Y: 308 to 745) -->
  <!-- COLUMN 1 -->
  <g transform="translate(50, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#ec4899" />
    <text x="32" y="23" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">COORDINATES &amp; AFFINE CTM</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Canvas State Stack (Save / Restore)</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">ctx.save() pushes current matrix, clip path, and</tspan>
        <tspan x="0" dy="13">styles to a stack. ctx.restore() pops state back,</tspan>
        <tspan x="0" dy="13">preventing transformations from leaking.</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Affine Transformation Matrix (CTM)</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="9.5">ctx.transform(a, b, c, d, e, f)</text>
      <text x="10" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">a=scaleX, b=skewY, c=skewX</text>
      <text x="10" y="76" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">d=scaleY, e=transX, f=transY</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 180)">
      <text x="0" y="14" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Centered Object Rotation Pattern</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Canvas rotates around (0,0) by default. To rotate</tspan>
        <tspan x="0" dy="13">around center (cx, cy): translate(cx, cy) &#8594;</tspan>
        <tspan x="0" dy="13">rotate(&#952;) &#8594; drawImage(-w/2, -h/2, w, h).</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 260)">
      <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#db2777" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9733; Retina / HiDPI Crispness Fix</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">DPR = window.devicePixelRatio || 1;</tspan>
        <tspan x="12" dy="13">canvas.width = rect.width * DPR;</tspan>
        <tspan x="12" dy="13">canvas.height = rect.height * DPR;</tspan>
        <tspan x="12" dy="13">ctx.scale(DPR, DPR) ensures zero blur on 4K.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 2 -->
  <g transform="translate(425, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#c084fc" />
    <text x="32" y="23" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PORTER-DUFF COMPOSITING</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Porter-Duff Masking Modes</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">&#8226; <tspan fill="#f8fafc">source-over:</tspan> Default, paints new over old</tspan>
        <tspan x="0" dy="13">&#8226; <tspan fill="#f8fafc">destination-in:</tspan> Keeps only overlapping alpha</tspan>
        <tspan x="0" dy="13">&#8226; <tspan fill="#f8fafc">destination-out:</tspan> Punches hole out of background</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Photographic Blend Equations</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">multiply: Output = (Source * Dest) / 255</text>
      <text x="10" y="60" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">screen: Output = 255 - ((255-S)*(255-D))/255</text>
      <text x="10" y="76" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9.5">overlay: Combines multiply &amp; screen</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 180)">
      <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Social Card Aspect Ratios</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">&#8226; 16:9 Landscape: 1200x675 (YouTube, Twitter)</tspan>
        <tspan x="0" dy="13">&#8226; 1:1 Square: 1080x1080 (Instagram, LinkedIn)</tspan>
        <tspan x="0" dy="13">&#8226; 9:16 Vertical: 1080x1920 (TikTok, Reels, Shorts)</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 260)">
      <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#7e22ce" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#128396; Pattern &amp; Gradient Fills</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">ctx.createPattern(img, 'repeat') creates tiled textures.</tspan>
        <tspan x="12" dy="13">createLinearGradient(x0,y0, x1,y1) defines vector light.</tspan>
        <tspan x="12" dy="13">Color stops (0.0 to 1.0) interpolate across hardware.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 3 -->
  <g transform="translate(800, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PIXEL MANIPULATION &amp; KERNELS</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Direct ImageData Pixel Buffer Access</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">ctx.getImageData(0,0,w,h).data returns raw 1D</tspan>
        <tspan x="0" dy="13">Uint8ClampedArray. Pixel (x, y) offset in array:</tspan>
        <tspan x="0" dy="13"><tspan fill="#f8fafc">index = (y * width + x) * 4 [R, G, B, A]</tspan></tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. 3x3 Convolution Kernel Matrices</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">Sharpen: [0,-1,0, -1,5,-1, 0,-1,0]</text>
      <text x="10" y="60" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">Edge Detect: [-1,-1,-1, -1,8,-1, -1,-1,-1]</text>
      <text x="10" y="76" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">Gaussian Blur: [1,2,1, 2,4,2, 1,2,1] / 16</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 180)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Color Toning &amp; Luminance Math</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Human eye weighted luminance (Rec. 709):</tspan>
        <tspan x="0" dy="13"><tspan fill="#f8fafc">Gray = 0.2126*R + 0.7152*G + 0.0722*B</tspan></tspan>
        <tspan x="0" dy="13">Sepia matrix mixes warm bronze into RGB channels.</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 260)">
      <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#128640; createImageBitmap &amp; Web Workers</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Heavy pixel manipulation freezes the UI thread.</tspan>
        <tspan x="12" dy="13">OffscreenCanvas and createImageBitmap allow</tspan>
        <tspan x="12" dy="13">running convolution filters in Web Workers.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- FOOTER BRANDING (Y: 760) -->
  <text x="600" y="764" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">OMNITOOL HUB CLIENT-SIDE SUITE &#8226; 100% PRIVATE &#8226; ZERO DATA TRANSMISSION &#8226; WEB STANDARDS COMPLIANT</text>
</svg>