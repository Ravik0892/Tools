<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGradDT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="titleGradDT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <pattern id="gridPatternDT" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradDT)" />
  <rect width="1200" height="800" fill="url(#gridPatternDT)" />
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB &#8226; TIME &amp; TIMESTAMPS</text>

    <text x="0" y="66" fill="url(#titleGradDT)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">ISO 8601, Unix Timestamps &amp; Timezone Architecture</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Visual standard reference for ISO 8601 timestamp tokens, Unix epoch milliseconds, Y2038 overflow, and UTC storage rules.</text>
  </g>

  <!-- Top Hero: ISO 8601 String Component Breakdown (Y: 155 to 295) -->
  <g transform="translate(50, 155)">
    <rect width="1100" height="140" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
    <text x="24" y="28" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">ISO 8601 EXTENDED FORMAT STRING ANATOMY</text>

    <!-- Raw String Banner -->
    <g transform="translate(24, 46)">
      <rect width="1050" height="38" rx="6" fill="#131a2c" stroke="#334155" stroke-width="1" />
      <text x="24" y="25" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">
        <tspan fill="#38bdf8">2026-10-31</tspan>
        <tspan fill="#f43f5e">T</tspan>
        <tspan fill="#34d399">14:30:45</tspan>
        <tspan fill="#c084fc">.850</tspan>
        <tspan fill="#fbbf24">+05:30</tspan>
        <tspan fill="#94a3b8">  (or </tspan>
        <tspan fill="#fbbf24">Z</tspan>
        <tspan fill="#94a3b8"> for UTC Zulu)</tspan>
      </text>
    </g>

    <!-- Labels below string -->
    <g transform="translate(24, 94)">
      <!-- Date -->
      <g transform="translate(0, 0)">
        <rect width="210" height="34" rx="4" fill="#0369a1" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">YYYY-MM-DD</text>
        <text x="100" y="21" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Calendar Date</text>
      </g>

      <!-- T Delimiter -->
      <g transform="translate(225, 0)">
        <rect width="130" height="34" rx="4" fill="#be123c" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="21" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">T</text>
        <text x="28" y="21" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Time Designator</text>
      </g>

      <!-- hh:mm:ss -->
      <g transform="translate(370, 0)">
        <rect width="180" height="34" rx="4" fill="#047857" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="21" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">hh:mm:ss</text>
        <text x="75" y="21" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">24-Hour Clock</text>
      </g>

      <!-- Fraction -->
      <g transform="translate(565, 0)">
        <rect width="170" height="34" rx="4" fill="#7e22ce" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="21" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">.sss</text>
        <text x="45" y="21" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Milliseconds (0-999)</text>
      </g>

      <!-- Offset / Z -->
      <g transform="translate(750, 0)">
        <rect width="300" height="34" rx="4" fill="#b45309" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="21" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">&#177;hh:mm or Z</text>
        <text x="95" y="21" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">UTC Offset (Z = Zulu / Zero offset)</text>
      </g>
    </g>
  </g>

  <!-- 3 Reference Columns (Y: 310 to 730) -->
  <!-- Col 1: Unix Epoch & Y2038 Problem -->
  <g transform="translate(50, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">UNIX EPOCH &amp; TIMESTAMP UNITS</text>

    <g transform="translate(18, 52)">
      <!-- Epoch Origin -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Unix Epoch Origin (Timestamp 0)</text>
        <rect x="0" y="22" width="314" height="26" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10.5">1970-01-01T00:00:00.000Z</text>
        <text x="0" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Counts elapsed SI seconds without counting leap seconds.</text>
      </g>

      <!-- Unit Multipliers -->
      <g transform="translate(0, 78)">
        <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Seconds vs Milliseconds Trap</text>
        <rect x="0" y="22" width="314" height="66" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; 10 Digits (Seconds): 1793540000</text>
        <text x="10" y="52" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; 13 Digits (Milliseconds): 1793540000000</text>
        <text x="10" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">JavaScript Date.now() returns 13-digit milliseconds.</text>
      </g>

      <!-- Y2038 Overflow Box -->
      <g transform="translate(0, 185)">
        <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="20" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">&#9888; The Year 2038 Problem (Y2038)</text>
        <text x="10" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="10" dy="0">On 2038-01-19 03:14:07 UTC, 32-bit signed ints</tspan>
          <tspan x="10" dy="13">overflow at <tspan fill="#f8fafc">2,147,483,647</tspan> and flip negative.</tspan>
        </text>
        <text x="10" y="74" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="10" dy="0">Solution: Migrate DB columns to 64-bit (BIGINT),</tspan>
          <tspan x="10" dy="13">which remain overflow-safe for 292 billion years.</tspan>
        </text>
      </g>

      <g transform="translate(0, 312)">
        <text x="0" y="14" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">&#8226; Pre-1970 dates are represented with negative Unix numbers.</text>
      </g>
    </g>
  </g>

  <!-- Col 2: Date Formatting Token Cheat Sheet -->
  <g transform="translate(425, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#fbbf24" />
    <text x="32" y="23" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">STRFTIME &amp; DATE-FNS TOKENS</text>

    <g transform="translate(18, 52)">
      <!-- Year -->
      <g transform="translate(0, 0)">
        <rect width="70" height="22" rx="4" fill="#1e293b" />
        <text x="35" y="15" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">YYYY / YY</text>
        <text x="85" y="15" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Year: 2026 / 26</text>
      </g>

      <!-- Month -->
      <g transform="translate(0, 32)">
        <rect width="70" height="22" rx="4" fill="#1e293b" />
        <text x="35" y="15" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">MM / MMM</text>
        <text x="85" y="15" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Month: 10 / Oct (MMMM = October)</text>
      </g>

      <!-- Day -->
      <g transform="translate(0, 64)">
        <rect width="70" height="22" rx="4" fill="#1e293b" />
        <text x="35" y="15" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">DD / dddd</text>
        <text x="85" y="15" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Day: 31 / Saturday</text>
      </g>

      <!-- Hours -->
      <g transform="translate(0, 96)">
        <rect width="70" height="22" rx="4" fill="#1e293b" />
        <text x="35" y="15" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">HH / hh</text>
        <text x="85" y="15" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Hour: 14 (24h) vs 02 (12h with A/PM)</text>
      </g>

      <!-- Minute/Sec -->
      <g transform="translate(0, 128)">
        <rect width="70" height="22" rx="4" fill="#1e293b" />
        <text x="35" y="15" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">mm / ss</text>
        <text x="85" y="15" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Minutes: 30 / Seconds: 45</text>
      </g>

      <!-- Millis -->
      <g transform="translate(0, 160)">
        <rect width="70" height="22" rx="4" fill="#1e293b" />
        <text x="35" y="15" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SSS</text>
        <text x="85" y="15" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Fractional milliseconds: 850</text>
      </g>

      <!-- Offset -->
      <g transform="translate(0, 192)">
        <rect width="70" height="22" rx="4" fill="#1e293b" />
        <text x="35" y="15" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">ZZ / Z</text>
        <text x="85" y="15" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Offset: +05:30 or +0530</text>
      </g>

      <!-- Code Example -->
      <g transform="translate(0, 230)">
        <rect width="314" height="74" rx="6" fill="#131a2c" stroke="#334155" stroke-width="1" />
        <text x="10" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5">new Date().toISOString();</text>
        <text x="10" y="34" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">// "2026-10-31T09:00:45.000Z"</text>
        <text x="10" y="54" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5">Date.now(); // 1793540000000</text>
      </g>
    </g>
  </g>

  <!-- Col 3: Universal Timezone Rules -->
  <g transform="translate(800, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#34d399" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">TIMEZONE ARCHITECTURE RULES</text>

    <g transform="translate(18, 52)">
      <!-- Rule 1: UTC Core -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">1. The Golden Law of UTC Storage</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Store &amp; transmit timestamps in pure UTC (<tspan fill="#f8fafc">Z</tspan>).</tspan>
          <tspan x="0" dy="13">Convert to local timezone only at UI boundary.</tspan>
        </text>
      </g>

      <!-- Rule 2: DST -->
      <g transform="translate(0, 75)">
        <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">2. Daylight Saving Time (DST) Fallacy</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Never assume 1 day = 86,400s! Across DST shifts,</tspan>
          <tspan x="0" dy="13">days have 23 or 25h. Adding 24h drifts time.</tspan>
        </text>
      </g>

      <!-- Rule 3: Database Types -->
      <g transform="translate(0, 155)">
        <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">3. Database Column Selection</text>
        <rect x="0" y="24" width="314" height="66" rx="4" fill="#131a2c" />
        <text x="10" y="40" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; PostgreSQL: TIMESTAMPTZ (Stores UTC)</text>
        <text x="10" y="58" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">&#8226; Avoid TIMESTAMP without timezone!</text>
      </g>

      <!-- Rule 4: IANA DB -->
      <g transform="translate(0, 255)">
        <text x="0" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">4. IANA Time Zone Database</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Use geographic IDs (<tspan fill="#f8fafc">"America/New_York"</tspan>) over</tspan>
          <tspan x="0" dy="13">ambiguous codes (<tspan fill="#e2e8f0">"EST"</tspan> vs <tspan fill="#e2e8f0">"EDT"</tspan>).</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>