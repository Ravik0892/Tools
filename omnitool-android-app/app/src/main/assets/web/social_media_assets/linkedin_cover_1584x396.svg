<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#FF33A8" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1584" height="396" fill="url(#bgGrad)" />
  <rect width="1584" height="396" fill="url(#grid)" />

  <!-- Glow Accents -->
  <circle cx="350" cy="198" r="220" fill="#FF007A" opacity="0.12" filter="blur(60px)" />
  <circle cx="1200" cy="198" r="220" fill="#00F2FE" opacity="0.10" filter="blur(60px)" />

  <g transform="translate(180, 110)">
    <!-- Icon -->
    <g transform="translate(0, 0) scale(7.2)">
      <path fill="none" stroke="url(#iconGradient)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)"
        d="M9.813 15.904L9 21L14.907 18M21 3L13.882 10.118M3 21L10.118 13.882M10.118 10.118L13.882 13.882M10.118 10.118L3 3M13.882 10.118L21 21" />
    </g>

    <!-- Main Title -->
    <text x="210" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="82" letter-spacing="-2px" fill="url(#textGradient)">OmniTool Hub</text>

    <!-- Subtitle -->
    <text x="215" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="24" letter-spacing="2px" fill="#94A3B8">DEVELOPER &amp; DESIGNER TOOLKIT SUITE</text>
  </g>
</svg>
