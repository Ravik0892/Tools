<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="dfTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#dfBg)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="160" cy="140" r="180" fill="#fbbf24" opacity="0.05" />
  <circle cx="1060" cy="180" r="200" fill="#38bdf8" opacity="0.05" />

  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB • DATA ENGINEERING</text>
    <text x="0" y="66" fill="url(#dfTitle)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">Data Formats Reference: JSON vs YAML vs CSV vs XML</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Side-by-side syntax comparison, nesting rules, comment capabilities, and production use cases.</text>
  </g>

  <!-- 4 SYNTAX CARDS (Same data record in 4 formats) (Y: 155 to 475) -->

  <!-- CARD 1: JSON -->
  <g transform="translate(50, 155)">
    <rect width="260" height="310" rx="10" fill="#0d121f" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 250 0 Q 260 0 260 10 L 260 36 L 0 36 Z" fill="#1b1712" />
    <circle cx="18" cy="18" r="4" fill="#fbbf24" />
    <text x="30" y="22" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">1. JSON (Strict Objects)</text>

    <!-- Code -->
    <g transform="translate(14, 52)">
      <text x="0" y="16" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">{</text>
      <text x="12" y="36" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">"id"<tspan fill="#e2e8f0">: </tspan><tspan fill="#38bdf8">101</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="12" y="56" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">"user"<tspan fill="#e2e8f0">: </tspan><tspan fill="#34d399">"Alice"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="12" y="76" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">"roles"<tspan fill="#e2e8f0">: [</tspan></text>
      <text x="24" y="96" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">"admin"<tspan fill="#e2e8f0">, </tspan><tspan fill="#34d399">"dev"</tspan></text>
      <text x="12" y="116" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">],</text>
      <text x="12" y="136" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">"active"<tspan fill="#e2e8f0">: </tspan><tspan fill="#f43f5e">true</tspan></text>
      <text x="0" y="156" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">}</text>

      <line x1="0" y1="175" x2="232" y2="175" stroke="#1e293b" stroke-width="0.8" />

      <text x="0" y="195" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">✓ Best for:</text>
      <text x="0" y="212" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">REST APIs, Web apps, NoSQL DBs.</text>
      <text x="0" y="235" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">❌ No comments allowed.</text>
    </g>
  </g>

  <!-- CARD 2: YAML -->
  <g transform="translate(330, 155)">
    <rect width="260" height="310" rx="10" fill="#0d121f" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 250 0 Q 260 0 260 10 L 260 36 L 0 36 Z" fill="#111b26" />
    <circle cx="18" cy="18" r="4" fill="#38bdf8" />
    <text x="30" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">2. YAML (Indented Human)</text>

    <!-- Code -->
    <g transform="translate(14, 52)">
      <text x="0" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5"># User Configuration</text>
      <text x="0" y="36" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">id<tspan fill="#e2e8f0">: </tspan><tspan fill="#fbbf24">101</tspan></text>
      <text x="0" y="56" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">user<tspan fill="#e2e8f0">: </tspan><tspan fill="#34d399">Alice</tspan></text>
      <text x="0" y="76" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">roles<tspan fill="#e2e8f0">:</tspan></text>
      <text x="12" y="96" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">- <tspan fill="#34d399">admin</tspan></text>
      <text x="12" y="116" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">- <tspan fill="#34d399">dev</tspan></text>
      <text x="0" y="136" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">active<tspan fill="#e2e8f0">: </tspan><tspan fill="#f43f5e">true</tspan></text>

      <line x1="0" y1="175" x2="232" y2="175" stroke="#1e293b" stroke-width="0.8" />

      <text x="0" y="195" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">✓ Best for:</text>
      <text x="0" y="212" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Kubernetes, Docker, GitHub Actions.</text>
      <text x="0" y="235" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">⚠️ Strict spacing indentation.</text>
    </g>
  </g>

  <!-- CARD 3: CSV -->
  <g transform="translate(610, 155)">
    <rect width="260" height="310" rx="10" fill="#0d121f" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 250 0 Q 260 0 260 10 L 260 36 L 0 36 Z" fill="#0e1f18" />
    <circle cx="18" cy="18" r="4" fill="#34d399" />
    <text x="30" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">3. CSV (Flat Delimited)</text>

    <!-- Code -->
    <g transform="translate(14, 52)">
      <text x="0" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5"># Header columns</text>
      <text x="0" y="38" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">id,user,roles,active</text>
      <text x="0" y="60" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="10.5">101,"Alice","admin;dev",true</text>

      <text x="0" y="96" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Nested arrays require delimited</text>
      <text x="0" y="114" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">strings (e.g. semicolon-separated).</text>

      <line x1="0" y1="175" x2="232" y2="175" stroke="#1e293b" stroke-width="0.8" />

      <text x="0" y="195" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">✓ Best for:</text>
      <text x="0" y="212" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Excel, database exports, ML datasets.</text>
      <text x="0" y="235" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">❌ No native hierarchy or types.</text>
    </g>
  </g>

  <!-- CARD 4: XML -->
  <g transform="translate(890, 155)">
    <rect width="260" height="310" rx="10" fill="#0d121f" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M 0 10 Q 0 0 10 0 L 250 0 Q 260 0 260 10 L 260 36 L 0 36 Z" fill="#1b1226" />
    <circle cx="18" cy="18" r="4" fill="#c084fc" />
    <text x="30" y="22" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">4. XML (Schema &amp; Tags)</text>

    <!-- Code -->
    <g transform="translate(14, 52)">
      <text x="0" y="16" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10.5">&lt;user id=<tspan fill="#38bdf8">"101"</tspan>&gt;</text>
      <text x="12" y="34" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">&lt;name&gt;<tspan fill="#34d399">Alice</tspan>&lt;/name&gt;</text>
      <text x="12" y="52" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">&lt;roles&gt;</text>
      <text x="24" y="70" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">&lt;role&gt;<tspan fill="#34d399">admin</tspan>&lt;/role&gt;</text>
      <text x="24" y="88" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">&lt;role&gt;<tspan fill="#34d399">dev</tspan>&lt;/role&gt;</text>
      <text x="12" y="106" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">&lt;/roles&gt;</text>
      <text x="12" y="124" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10.5">&lt;active&gt;<tspan fill="#f43f5e">true</tspan>&lt;/active&gt;</text>
      <text x="0" y="142" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10.5">&lt;/user&gt;</text>

      <line x1="0" y1="175" x2="232" y2="175" stroke="#1e293b" stroke-width="0.8" />

      <text x="0" y="195" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">✓ Best for:</text>
      <text x="0" y="212" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Android XML, SVG, SOAP services.</text>
      <text x="0" y="235" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">⚠️ High tag verbosity &amp; bytes.</text>
    </g>
  </g>

  <!-- BOTTOM MATRIX SUMMARY (Y: 485 to 745) -->
  <g transform="translate(50, 485)">
    <rect width="1100" height="260" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 36 L 0 36 Z" fill="#131b2e" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="32" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">FORMAT CAPABILITY MATRIX &amp; DECISION GUIDE</text>

    <!-- Header Row -->
    <g transform="translate(20, 52)">
      <text x="0" y="14" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">FORMAT</text>
      <text x="120" y="14" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">HUMAN READABILITY</text>
      <text x="300" y="14" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">DATA HIERARCHY</text>
      <text x="470" y="14" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">COMMENTS</text>
      <text x="610" y="14" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">DATA TYPES</text>
      <text x="760" y="14" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">PRIMARY ROLE</text>
      <line x1="0" y1="26" x2="1060" y2="26" stroke="#1e293b" stroke-width="1" />
    </g>

    <!-- Row JSON -->
    <g transform="translate(20, 92)">
      <text x="0" y="14" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">JSON</text>
      <text x="120" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">⭐⭐⭐⭐ (Good)</text>
      <text x="300" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Deep Nesting</text>
      <text x="470" y="14" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">❌ No</text>
      <text x="610" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Str, Num, Bool, Null</text>
      <text x="760" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Universal Web API Payloads</text>
      <line x1="0" y1="26" x2="1060" y2="26" stroke="#1e293b" stroke-width="0.7" />
    </g>

    <!-- Row YAML -->
    <g transform="translate(20, 130)">
      <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">YAML</text>
      <text x="120" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">⭐⭐⭐⭐⭐ (Superb)</text>
      <text x="300" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Deep Nesting</text>
      <text x="470" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">✓ Yes (#)</text>
      <text x="610" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Extensive (Dates, etc.)</text>
      <text x="760" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">DevOps &amp; Cloud Configs</text>
      <line x1="0" y1="26" x2="1060" y2="26" stroke="#1e293b" stroke-width="0.7" />
    </g>

    <!-- Row CSV -->
    <g transform="translate(20, 168)">
      <text x="0" y="14" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">CSV</text>
      <text x="120" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">⭐⭐⭐ (Table only)</text>
      <text x="300" y="14" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Flat Table Only</text>
      <text x="470" y="14" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">❌ No standard</text>
      <text x="610" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Strings Only</text>
      <text x="760" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Data Analysis &amp; Spreadsheets</text>
      <line x1="0" y1="26" x2="1060" y2="26" stroke="#1e293b" stroke-width="0.7" />
    </g>

    <!-- Row XML -->
    <g transform="translate(20, 206)">
      <text x="0" y="14" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">XML</text>
      <text x="120" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">⭐⭐ (Verbose)</text>
      <text x="300" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Deep + Attributes</text>
      <text x="470" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">✓ Yes (&lt;!--&gt;)</text>
      <text x="610" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Strings (XSD Schemas)</text>
      <text x="760" y="14" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Enterprise Schemas &amp; Documents</text>
    </g>
  </g>
</svg>
