<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Outer Protective Frame -->
  <rect x="24" y="24" width="1152" height="752" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER REGION (Y: 44 to 125) -->
  <g transform="translate(50, 44)">
    <!-- Badge -->
    <rect width="320" height="22" rx="11" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="11" cy="11" r="4" fill="#00f2fe" />
    <text x="22" y="15" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">OMNITOOL HUB &#8226; CONVERSION</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">SCIENTIFIC &amp; DIGITAL UNIT CONVERSION MATRIX</text>

    <!-- Subtitle -->
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">SI Metric Constants, IEC vs Decimal Storage, Physics Anchors, and Energy Equivalencies</text>
  </g>

  <!-- TOP OVERVIEW REGION (Y: 135 to 295) -->
  <g transform="translate(50, 135)">
    <rect width="1100" height="155" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 32 L 0 32 Z" fill="#131a2c" />
    <text x="20" y="21" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">DIGITAL STORAGE STANDARDS: DECIMAL SI (1000) VS BINARY IEC (1024)</text>

    <!-- Storage Table Comparison -->
    <g transform="translate(30, 44)">
      <!-- Row 1: Header -->
      <rect width="1040" height="24" rx="4" fill="#131a2c" />
      <text x="20" y="16" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">SI Metric Decimal (Power of 10) &#8212; Drive Makers</text>
      <text x="440" y="16" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">IEC Binary (Power of 2) &#8212; OS &amp; Memory</text>
      <text x="860" y="16" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Difference</text>

      <!-- Row 2: KB vs KiB -->
      <g transform="translate(0, 28)">
        <text x="20" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">1 KB = 1,000 Bytes (10^3)</text>
        <text x="440" y="14" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">1 KiB = 1,024 Bytes (2^10)</text>
        <text x="860" y="14" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">+2.4% gap</text>
      </g>

      <!-- Row 3: MB vs MiB -->
      <g transform="translate(0, 48)">
        <text x="20" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">1 MB = 1,000,000 Bytes (10^6)</text>
        <text x="440" y="14" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">1 MiB = 1,048,576 Bytes (2^20)</text>
        <text x="860" y="14" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">+4.9% gap</text>
      </g>

      <!-- Row 4: GB vs GiB -->
      <g transform="translate(0, 68)">
        <text x="20" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">1 GB = 1,000,000,000 Bytes (10^9)</text>
        <text x="440" y="14" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">1 GiB = 1,073,741,824 Bytes (2^30)</text>
        <text x="860" y="14" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">+7.4% gap</text>
      </g>

      <!-- Row 5: TB vs TiB -->
      <g transform="translate(0, 88)">
        <text x="20" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">1 TB = 1,000,000,000,000 Bytes (10^12)</text>
        <text x="440" y="14" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">1 TiB = 1,099,511,627,776 Bytes (2^40)</text>
        <text x="860" y="14" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10">+9.9% gap</text>
      </g>
    </g>
    
  </g>

  <!-- 3 CORE COLUMNS REGION (Y: 308 to 745) -->
  <!-- COLUMN 1 -->
  <g transform="translate(50, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">DIGITAL DATA &amp; STORAGE</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Bits (b) vs Bytes (B)</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">1 Byte = 8 bits. Network throughput is measured in</tspan>
        <tspan x="0" dy="13">bits (Mbps), while file storage uses Bytes (MB).</tspan>
        <tspan x="0" dy="13"><tspan fill="#f8fafc">100 Mbps broadband = 12.5 MB/s download speed.</tspan></tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. The "Missing Drive Space" Mystery</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">When you buy a 1TB SSD, Windows reports 931 GB.</tspan>
        <tspan x="0" dy="13">The manufacturer sold 1,000,000,000,000 Bytes (SI).</tspan>
        <tspan x="0" dy="13">Windows divides by 1024^3 (GiB) but labels it GB.</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 160)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Decimal Prefix Scale (SI)</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">Kilo (k): 10^3 &#8226; Mega (M): 10^6</text>
      <text x="10" y="60" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">Giga (G): 10^9 &#8226; Tera (T): 10^12</text>
      <text x="10" y="76" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">Peta (P): 10^15 &#8226; Exa (E): 10^18</text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 260)">
      <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9881; Bandwidth Calculation Formula</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Transfer Time = (File Size in Bytes * 8) / Bandwidth in bps.</tspan>
        <tspan x="12" dy="13">Example: Transferring a 4GB file over 50 Mbps link:</tspan>
        <tspan x="12" dy="13">(4 * 1024 * 8) / 50 = 655 seconds (~11 minutes).</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 2 -->
  <g transform="translate(425, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#fbbf24" />
    <text x="32" y="23" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">LENGTH, MASS &amp; TEMPERATURE</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Length Exact International Anchors</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">By international treaty (1959), Imperial units</tspan>
        <tspan x="0" dy="13">are defined strictly in terms of the Metric meter:</tspan>
        <tspan x="0" dy="13"><tspan fill="#f8fafc">1 inch = 25.4 mm (exact definition)</tspan></tspan>
        <tspan x="0" dy="13">1 foot = 0.3048 m &#8226; 1 mile = 1,609.344 m</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 95)">
      <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Mass &amp; Weight Standards</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">1 pound (avoirdupois) = 0.45359237 kg exact.</tspan>
        <tspan x="0" dy="13">1 ounce = 28.3495 grams &#8226; 1 stone = 14 lbs (6.35 kg).</tspan>
        <tspan x="0" dy="13">1 Metric Ton (tonne) = 1,000 kg = 2,204.62 lbs.</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 175)">
      <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Temperature Scale Conversions</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">Kelvin: K = &#176;C + 273.15 (Absolute Zero)</text>
      <text x="10" y="60" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">Fahrenheit: &#176;F = (&#176;C * 1.8) + 32</text>
      <text x="10" y="76" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">Celsius: &#176;C = (&#176;F - 32) / 1.8</text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 275)">
      <rect width="314" height="95" rx="8" fill="#131a2c" stroke="#d97706" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9888; The -40 Degree Crossover</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">-40&#176;C is exactly equal to -40&#176;F!</tspan>
        <tspan x="12" dy="13">Water freezes at 0&#176;C (32&#176;F), boils at 100&#176;C (212&#176;F).</tspan>
        <tspan x="12" dy="13">Room temperature: 20&#8211;22&#176;C = 68&#8211;72&#176;F.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 3 -->
  <g transform="translate(800, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#34d399" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">ENERGY, POWER &amp; PRESSURE</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Energy &amp; Work Equivalencies</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">1 Joule = 1 Watt-second = 1 N&#183;m.</tspan>
        <tspan x="0" dy="13">1 Calorie (thermochemical) = 4.184 Joules.</tspan>
        <tspan x="0" dy="13">1 food Calorie (kcal) = 4,184 J &#8226; 1 kWh = 3.6 MJ.</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Pressure Standards &amp; Atmospheres</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">1 Standard Atmosphere (atm) at sea level:</tspan>
        <tspan x="0" dy="13">&#8226; 101,325 Pascals (N/m&#178;) = 101.325 kPa</tspan>
        <tspan x="0" dy="13">&#8226; 1.01325 bar &#8226; 14.696 PSI &#8226; 760 mmHg (torr)</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 160)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Power &amp; Mechanical Work</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">1 Watt (W) = 1 Joule / second</text>
      <text x="10" y="60" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">1 Horsepower (HP) = 745.7 Watts</text>
      <text x="10" y="76" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">1 BTU / hour = 0.293071 Watts</text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 260)">
      <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#059669" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9733; Floating Point Precision Tip</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">To avoid 0.0000000000000002 drift in JavaScript,</tspan>
        <tspan x="12" dy="13">always convert values into base units (e.g. grams,</tspan>
        <tspan x="12" dy="13">meters) as pure integers before scaling, then format</tspan>
        <tspan x="12" dy="13">with Number.prototype.toPrecision(12).</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- FOOTER BRANDING (Y: 760) -->
  <text x="600" y="764" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">OMNITOOL HUB CLIENT-SIDE SUITE &#8226; 100% PRIVATE &#8226; ZERO DATA TRANSMISSION &#8226; WEB STANDARDS COMPLIANT</text>
</svg>