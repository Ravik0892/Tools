<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="titleGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <pattern id="gridPatternD" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradD)" />
  <rect width="1200" height="800" fill="url(#gridPatternD)" />
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB &#8226; VERSION CONTROL</text>

    <text x="0" y="66" fill="url(#titleGradD)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">Unified Diff, Patch Anatomy &amp; Merge Conflicts</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Visual guide to Myers diff algorithm hunk headers, patch file syntax, additions/deletions, and 3-way merge resolution.</text>
  </g>

  <!-- Top Hero: Unified Diff Hunk Header Anatomy (Y: 155 to 295) -->
  <g transform="translate(50, 155)">
    <rect width="1100" height="140" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
    <text x="24" y="28" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">UNIFIED DIFF HUNK HEADER ANATOMY: @@ -l,s +l,s @@</text>

    <!-- Raw Hunk Bar -->
    <g transform="translate(24, 46)">
      <rect width="1050" height="36" rx="6" fill="#131a2c" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="700">
        <tspan fill="#38bdf8">@@ </tspan>
        <tspan fill="#f43f5e">-42,7 </tspan>
        <tspan fill="#10b981">+45,9 </tspan>
        <tspan fill="#38bdf8">@@ </tspan>
        <tspan fill="#94a3b8">class AuthenticationService {</tspan>
      </text>
    </g>

    <!-- Hunk Component Labels -->
    <g transform="translate(24, 94)">
      <!-- Left minus box -->
      <g transform="translate(0, 0)">
        <rect width="280" height="34" rx="4" fill="#be123c" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="21" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">-42,7 :</text>
        <text x="55" y="21" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Original File: Line 42, length 7 lines</text>
      </g>

      <!-- Right plus box -->
      <g transform="translate(300, 0)">
        <rect width="280" height="34" rx="4" fill="#047857" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="21" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">+45,9 :</text>
        <text x="55" y="21" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">New File: Line 45, length 9 lines</text>
      </g>

      <!-- Function context heading -->
      <g transform="translate(600, 0)">
        <rect width="450" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="10" y="21" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Context Heading: Nearest enclosing function or class header</text>
      </g>
    </g>
  </g>

  <!-- 3 Reference Columns (Y: 310 to 730) -->
  <!-- Col 1: Diff Symbols & Patch Structure -->
  <g transform="translate(50, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PATCH SYMBOLS &amp; METADATA</text>

    <g transform="translate(18, 52)">
      <!-- Symbol table -->
      <g transform="translate(0, 0)">
        <rect width="314" height="28" rx="4" fill="#131a2c" />
        <text x="12" y="19" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">--- a/src/app.ts</text>
        <text x="180" y="19" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Original (Old) file</text>
      </g>

      <g transform="translate(0, 34)">
        <rect width="314" height="28" rx="4" fill="#131a2c" />
        <text x="12" y="19" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">+++ b/src/app.ts</text>
        <text x="180" y="19" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Modified (New) file</text>
      </g>

      <g transform="translate(0, 68)">
        <rect width="314" height="28" rx="4" fill="#022c22" stroke="#10b981" stroke-opacity="0.3" stroke-width="0.8" />
        <text x="12" y="19" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">+ const token = 'jwt';</text>
        <text x="220" y="19" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Line Added</text>
      </g>

      <g transform="translate(0, 102)">
        <rect width="314" height="28" rx="4" fill="#3f0714" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="0.8" />
        <text x="12" y="19" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">- var token = 'basic';</text>
        <text x="220" y="19" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Line Deleted</text>
      </g>

      <g transform="translate(0, 136)">
        <rect width="314" height="28" rx="4" fill="#131a2c" />
        <text x="12" y="19" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">&#160; return validate();</text>
        <text x="220" y="19" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Context Line</text>
      </g>

      <!-- Patch Apply Command -->
      <g transform="translate(0, 185)">
        <rect width="314" height="150" rx="8" fill="#131a2c" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Applying Patches in Git</text>
        
        <text x="12" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Check whether patch applies cleanly:</text>
        <rect x="12" y="52" width="290" height="22" rx="4" fill="#0a0e17" />
        <text x="20" y="67" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">git apply --check changes.patch</text>

        <text x="12" y="94" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Apply patch to working directory:</text>
        <rect x="12" y="102" width="290" height="22" rx="4" fill="#0a0e17" />
        <text x="20" y="117" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">git apply changes.patch</text>

        <text x="12" y="140" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Three lines of context (default: -U3) anchor the patch.</text>
      </g>
    </g>
  </g>

  <!-- Col 2: Git Conflict Marker Anatomy -->
  <g transform="translate(425, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#f43f5e" />
    <text x="32" y="23" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">MERGE CONFLICT MARKER BREAKDOWN</text>

    <g transform="translate(18, 52)">
      <!-- Conflict Block -->
      <rect width="314" height="210" rx="8" fill="#131a2c" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />

      <!-- Head Marker -->
      <g transform="translate(10, 15)">
        <text x="0" y="12" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
        <text x="110" y="12" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">(Current branch changes)</text>
      </g>

      <!-- Head content -->
      <g transform="translate(10, 38)">
        <rect width="294" height="26" rx="4" fill="#0369a1" fill-opacity="0.2" />
        <text x="10" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5">const API_TIMEOUT = 5000;</text>
      </g>

      <!-- Divider -->
      <g transform="translate(10, 78)">
        <text x="0" y="12" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">=======</text>
        <text x="75" y="12" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">(Center boundary delimiter)</text>
      </g>

      <!-- Incoming content -->
      <g transform="translate(10, 102)">
        <rect width="294" height="26" rx="4" fill="#7e22ce" fill-opacity="0.2" />
        <text x="10" y="18" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10.5">const API_TIMEOUT = 10000;</text>
      </g>

      <!-- Incoming Marker -->
      <g transform="translate(10, 142)">
        <text x="0" y="12" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/resilience</text>
        <text x="180" y="12" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">(Incoming branch)</text>
      </g>

      <g transform="translate(10, 172)">
        <text x="0" y="14" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">&#9888; Never commit markers to production! Delete lines and boundaries.</text>
      </g>

      <!-- Resolution Steps -->
      <g transform="translate(0, 225)">
        <text x="0" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Conflict Resolution Checklist:</text>
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">1. Identify intention of both branches.</text>
        <text x="0" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">2. Choose one or merge logical behaviors.</text>
        <text x="0" y="64" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">3. Delete all 7-character conflict marker tags.</text>
        <text x="0" y="80" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5">git add path/to/file.ts &amp;&amp; git commit</text>
      </g>
    </g>
  </g>

  <!-- Col 3: Diff Algorithms & 3-Way Merge -->
  <g transform="translate(800, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#10b981" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">ALGORITHMS &amp; 3-WAY MERGE</text>

    <g transform="translate(18, 52)">
      <!-- Algorithms comparison -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">1. Myers Diff Algorithm (Default)</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Finds shortest edit script (SES) via greedy graph</tspan>
          <tspan x="0" dy="13">search. Fast O((N+M)D) on typical code edits.</tspan>
        </text>
      </g>

      <g transform="translate(0, 60)">
        <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">2. Histogram / Patience Diff</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Anchors on unique lines to prevent spurious</tspan>
          <tspan x="0" dy="13">bracket matching on repeated braces <tspan fill="#e2e8f0">}</tspan>.</tspan>
        </text>
      </g>

      <!-- 3-Way Merge Diagram -->
      <g transform="translate(0, 130)">
        <rect width="314" height="195" rx="8" fill="#131a2c" stroke="#334155" stroke-width="1" />
        <text x="12" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">The 3-Way Merge Model</text>
        <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Git compares branches against their common ancestor:</text>

        <!-- Base Node -->
        <g transform="translate(107, 55)">
          <rect width="100" height="24" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
          <text x="50" y="16" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Base (LCA)</text>
        </g>

        <!-- Branch 1 (Ours) -->
        <g transform="translate(20, 100)">
          <rect width="110" height="24" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
          <text x="55" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Ours (Local)</text>
        </g>

        <!-- Branch 2 (Theirs) -->
        <g transform="translate(184, 100)">
          <rect width="110" height="24" rx="4" fill="#7e22ce" fill-opacity="0.3" stroke="#c084fc" stroke-width="1" />
          <text x="55" y="16" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Theirs (Remote)</text>
        </g>

        <!-- Merge Target -->
        <g transform="translate(107, 145)">
          <rect width="100" height="26" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1" />
          <text x="50" y="17" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">Merged State</text>
        </g>

        <text x="12" y="186" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">&#10003; If only one side changed relative to Base, Git merges automatically!</text>
      </g>
    </g>
  </g>
</svg>