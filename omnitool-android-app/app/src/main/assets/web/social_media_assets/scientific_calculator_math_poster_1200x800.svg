<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Outer Protective Frame -->
  <rect x="24" y="24" width="1152" height="752" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER REGION (Y: 44 to 125) -->
  <g transform="translate(50, 44)">
    <!-- Badge -->
    <rect width="320" height="22" rx="11" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="11" cy="11" r="4" fill="#00f2fe" />
    <text x="22" y="15" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">OMNITOOL HUB &#8226; CALCULATOR</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">SCIENTIFIC COMPUTING &amp; CALCULATOR ALGORITHMS</text>

    <!-- Subtitle -->
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Shunting-Yard Parsing, IEEE-754 Float Standards, Trigonometry, and Combinatorics</text>
  </g>

  <!-- TOP OVERVIEW REGION (Y: 135 to 295) -->
  <g transform="translate(50, 135)">
    <rect width="1100" height="155" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 32 L 0 32 Z" fill="#131a2c" />
    <text x="20" y="21" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">EXPRESSION EVALUATION ENGINE: DIJKSTRA'S SHUNTING-YARD ALGORITHM</text>

    <!-- Pipeline Flow -->
    <g transform="translate(30, 46)">
      <!-- Box 1 -->
      <g transform="translate(0, 0)">
        <rect width="260" height="88" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
        <text x="14" y="22" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">1. Infix Expression</text>
        <text x="14" y="44" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12">3 + 4 * 2 / ( 1 - 5 ) ^ 2</text>
        <text x="14" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Human notation: operators between operands</text>
      </g>

      <polygon points="280,42 288,46 280,50" fill="#475569" />

      <!-- Box 2 -->
      <g transform="translate(298, 0)">
        <rect width="450" height="88" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="14" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">2. Shunting-Yard Parser (Precedence &amp; Stack)</text>
        <text x="14" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="14" dy="0">&#8226; Numbers push straight to Output Queue</tspan>
          <tspan x="14" dy="14">&#8226; Operators push to Stack; pop higher precedence to Queue</tspan>
          <tspan x="14" dy="14">&#8226; Parentheses enforce precedence boundary</tspan>
        </text>
      </g>

      <polygon points="768,42 776,46 768,50" fill="#475569" />

      <!-- Box 3 -->
      <g transform="translate(786, 0)">
        <rect width="254" height="88" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2" />
        <text x="14" y="22" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">3. RPN Evaluation</text>
        <text x="14" y="44" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">3 4 2 * 1 5 - 2 ^ / +</text>
        <text x="14" y="68" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">= 3.5 (Stack output)</text>
      </g>
    </g>
    
  </g>

  <!-- 3 CORE COLUMNS REGION (Y: 308 to 745) -->
  <!-- COLUMN 1 -->
  <g transform="translate(50, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#34d399" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">OPERATOR PRECEDENCE &amp; PARSING</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Operator Precedence Hierarchy</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">Level 4: Parentheses () &#8226; Functions (sin, ln)</text>
      <text x="10" y="60" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">Level 3: Exponentiation ^ (Right-associative)</text>
      <text x="10" y="76" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">Level 2: * / % &#8226; Level 1: + - (Left-assoc)</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 110)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Associativity Rule Trap</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Left-associative: 10 - 4 - 2 = (10-4) - 2 = 4.</tspan>
        <tspan x="0" dy="13">Right-associative: 2 ^ 3 ^ 2 = 2 ^ (3^2) = 512.</tspan>
        <tspan x="0" dy="13">Evaluating power left-to-right yields 64 (wrong!).</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 190)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Tokenization &amp; Syntax Validation</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Differentiates binary minus (5 - 3) from unary</tspan>
        <tspan x="0" dy="13">negation (-5). Flags syntax errors on unbalanced</tspan>
        <tspan x="0" dy="13">parentheses before parsing starts.</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 270)">
      <rect width="314" height="100" rx="8" fill="#131a2c" stroke="#059669" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9881; Zero-Eval Security Standard</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">OmniTool never calls eval() or Function() on</tspan>
        <tspan x="12" dy="13">math strings. AST Shunting-Yard completely</tspan>
        <tspan x="12" dy="13">eliminates code injection and XSS exploits.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 2 -->
  <g transform="translate(425, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">IEEE-754 FLOAT STANDARDS</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. IEEE-754 64-Bit Float Architecture</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Standard double-precision binary layout:</tspan>
        <tspan x="0" dy="13">&#8226; 1 Sign Bit (S) &#8226; 11 Exponent Bits (E)</tspan>
        <tspan x="0" dy="13">&#8226; 52 Fraction / Mantissa Bits (53 bits precision)</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. The 0.1 + 0.2 Binary Precision Trap</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9.5">0.1 + 0.2 === 0.30000000000000004</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">0.1 decimal = 0.0001100110011... repeating</text>
      <text x="10" y="76" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">Fix: Math.abs(a - b) &lt; Number.EPSILON</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 180)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Special Float Sentinel Values</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">&#8226; NaN: 0/0, Math.sqrt(-1). NaN === NaN is false!</tspan>
        <tspan x="0" dy="13">&#8226; Infinity: 1 / 0 &#8226; -Infinity: -1 / 0</tspan>
        <tspan x="0" dy="13">&#8226; -0: 1/-0 = -Infinity, 1/+0 = +Infinity</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 260)">
      <rect width="314" height="110" rx="8" fill="#131a2c" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9733; Safe Integer Boundary Limits</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Number.MAX_SAFE_INTEGER = 9,007,199,254,740,991.</tspan>
        <tspan x="12" dy="13">Beyond 2^53 - 1, integers lose precision and</tspan>
        <tspan x="12" dy="13">calculations require BigInt (n suffix).</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 3 -->
  <g transform="translate(800, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#fbbf24" />
    <text x="32" y="23" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">TRIG, STATS &amp; COMBINATORICS</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Radians vs Degrees Conversion</text>
      <rect x="0" y="28" width="314" height="66" rx="4" fill="#131a2c" />
      <text x="10" y="44" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">rad = deg * (&#960; / 180) &#8226; deg = rad * (180 / &#960;)</text>
      <text x="10" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">sin(90&#176;) = 1 &#8226; cos(0&#176;) = 1 &#8226; tan(45&#176;) = 1</text>
      <text x="10" y="76" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">JS Math.sin/cos/tan strictly expect radians!</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 110)">
      <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Combinatorics (Permutations &amp; Combos)</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">&#8226; Factorial: n! = n * (n-1) * ... * 1 (0! = 1)</tspan>
        <tspan x="0" dy="13">&#8226; Permutations: P(n, r) = n! / (n - r)! (Order matters)</tspan>
        <tspan x="0" dy="13">&#8226; Combinations: C(n, r) = n! / (r! * (n - r)!)</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 190)">
      <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Logarithms &amp; Constants</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">&#8226; &#960; = 3.1415926535... &#8226; e = 2.7182818284...</tspan>
        <tspan x="0" dy="13">&#8226; Natural Log: ln(x) = log_e(x) (Math.log)</tspan>
        <tspan x="0" dy="13">&#8226; Common Log: log10(x) = ln(x) / ln(10)</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 270)">
      <rect width="314" height="100" rx="8" fill="#131a2c" stroke="#d97706" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9888; Domain Errors &amp; Guards</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Logarithms for x &#8804; 0 are undefined in real math.</tspan>
        <tspan x="12" dy="13">Square root for negative numbers yields imaginary.</tspan>
        <tspan x="12" dy="13">OmniTool displays clear alerts instead of silent NaN.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- FOOTER BRANDING (Y: 760) -->
  <text x="600" y="764" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">OMNITOOL HUB CLIENT-SIDE SUITE &#8226; 100% PRIVATE &#8226; ZERO DATA TRANSMISSION &#8226; WEB STANDARDS COMPLIANT</text>
</svg>