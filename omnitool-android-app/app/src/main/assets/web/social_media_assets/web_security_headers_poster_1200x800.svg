<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="titleGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <pattern id="gridPattern3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad3)" />
  <rect width="1200" height="800" fill="url(#gridPattern3)" />
  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB &#8226; WEB APPLICATION SECURITY</text>

    <text x="0" y="66" fill="url(#titleGrad3)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">HTTP Security Headers &amp; Browser Defenses</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Comprehensive reference for CSP directives, CORS preflight authorization flow, HSTS, and cookie security flags.</text>
  </g>

  <!-- Top Hero: CORS Preflight Flowchart (Y: 155 to 295) -->
  <g transform="translate(50, 155)">
    <rect width="1100" height="140" rx="12" fill="#0d121f" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />

    <text x="24" y="28" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">CORS PREFLIGHT HANDSHAKE FLOW (CROSS-ORIGIN RESOURCE SHARING)</text>

    <!-- Client Box -->
    <g transform="translate(24, 46)">
      <rect width="180" height="78" rx="8" fill="#131a2c" stroke="#38bdf8" stroke-width="1" />
      <text x="90" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">&#128187; Browser (Client)</text>
      <text x="90" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Origin: https://app.com</text>
      <text x="90" y="62" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Non-simple PUT/DELETE/Auth</text>
    </g>

    <!-- Preflight Step 1 Arrow -->
    <g transform="translate(215, 62)">
      <line x1="0" y1="0" x2="160" y2="0" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 2" />
      <polygon points="160,0 152,-4 152,4" fill="#f43f5e" />
      <text x="80" y="-8" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">1. OPTIONS /api/data</text>
    </g>

    <!-- Server Box -->
    <g transform="translate(390, 46)">
      <rect width="210" height="78" rx="8" fill="#131a2c" stroke="#a855f7" stroke-width="1" />
      <text x="105" y="24" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">&#9881; API Server</text>
      <text x="105" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Validates Request-Method &amp; Origin</text>
      <text x="105" y="62" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">204 No Content</text>
    </g>

    <!-- Preflight Step 2 Arrow -->
    <g transform="translate(615, 62)">
      <line x1="0" y1="0" x2="160" y2="0" stroke="#34d399" stroke-width="1.5" />
      <polygon points="160,0 152,-4 152,4" fill="#34d399" />
      <text x="80" y="-8" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">2. Allow-Origin / Methods</text>
    </g>

    <!-- Real Request Box -->
    <g transform="translate(790, 46)">
      <rect width="285" height="78" rx="8" fill="#022c22" fill-opacity="0.6" stroke="#10b981" stroke-width="1" />
      <text x="142" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">&#10003; 3. Actual Request Executed</text>
      <text x="142" y="44" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">PUT /api/data with payload</text>
      <text x="142" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Browser enforces: No headers = block response</text>
    </g>
  </g>

  <!-- 3 Reference Columns (Y: 310 to 730) -->
  <!-- Col 1: Content-Security-Policy (CSP) Directives -->
  <g transform="translate(50, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#f43f5e" />
    <text x="32" y="23" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">CONTENT-SECURITY-POLICY (CSP)</text>

    <g transform="translate(18, 52)">
      <!-- CSP item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">default-src 'self'</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Fallback boundary. Disallows external scripts,</tspan>
          <tspan x="0" dy="13">styles, and fonts unless explicitly permitted.</tspan>
        </text>
      </g>

      <!-- CSP item 2 -->
      <g transform="translate(0, 56)">
        <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">script-src 'self' 'nonce-...'</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Mitigates 99% of XSS. Disallows inline scripts</tspan>
          <tspan x="0" dy="13">without per-request nonces or sha256 hashes.</tspan>
        </text>
      </g>

      <!-- CSP item 3 -->
      <g transform="translate(0, 112)">
        <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">style-src 'self' 'unsafe-inline'</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Controls stylesheet origins. Best combined with</tspan>
          <tspan x="0" dy="13">hash pinning to stop CSS exfiltration attacks.</tspan>
        </text>
      </g>

      <!-- CSP item 4 -->
      <g transform="translate(0, 168)">
        <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">connect-src 'self' https://api...</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Whitelists endpoints for fetch(), XHR, WebSockets,</tspan>
          <tspan x="0" dy="13">and EventSource connection streams.</tspan>
        </text>
      </g>

      <!-- CSP item 5 -->
      <g transform="translate(0, 224)">
        <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">object-src 'none'</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Disables deprecated plugins, Flash, Java applets,</tspan>
          <tspan x="0" dy="13">and legacy browser object embeddings.</tspan>
        </text>
      </g>

      <!-- CSP item 6 -->
      <g transform="translate(0, 280)">
        <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">frame-ancestors 'none'</text>
        <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Blocks embedding inside iframes on any domain.</tspan>
          <tspan x="0" dy="13">Modern standard replacement for X-Frame-Options.</tspan>
        </text>
      </g>

      <!-- Production snippet -->
      <g transform="translate(0, 336)">
        <rect width="314" height="26" rx="4" fill="#131a2c" stroke="#334155" stroke-width="0.8" />
        <text x="10" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">upgrade-insecure-requests; block-all-mixed-content;</text>
      </g>
    </g>
  </g>

  <!-- Col 2: Core Transport & Header Defenses -->
  <g transform="translate(425, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#fbbf24" />
    <text x="32" y="23" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">TRANSPORT &amp; HARDENING HEADERS</text>

    <g transform="translate(18, 52)">
      <!-- HSTS -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Strict-Transport-Security (HSTS)</text>
        <rect x="0" y="22" width="314" height="24" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">max-age=31536000; includeSubDomains; preload</text>
        <text x="0" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Forces HTTPS for 1 year. Protects against SSL</tspan>
          <tspan x="0" dy="13">stripping and man-in-the-middle downgrade attacks.</tspan>
        </text>
      </g>

      <!-- X-Content-Type-Options -->
      <g transform="translate(0, 92)">
        <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">X-Content-Type-Options</text>
        <rect x="0" y="22" width="120" height="24" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">nosniff</text>
        <text x="0" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Stops browsers from MIME-sniffing responses away</tspan>
          <tspan x="0" dy="13">from Content-Type (prevents script disguise).</tspan>
        </text>
      </g>

      <!-- Referrer-Policy -->
      <g transform="translate(0, 180)">
        <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Referrer-Policy</text>
        <rect x="0" y="22" width="280" height="24" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">strict-origin-when-cross-origin</text>
        <text x="0" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Full URL on same-origin, origin on cross-origin,</tspan>
          <tspan x="0" dy="13">and zero referrer leak on HTTPS &#8594; HTTP requests.</tspan>
        </text>
      </g>

      <!-- Permissions-Policy -->
      <g transform="translate(0, 268)">
        <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Permissions-Policy (Feature Policy)</text>
        <rect x="0" y="22" width="314" height="24" rx="4" fill="#131a2c" />
        <text x="10" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">camera=(), microphone=(), geolocation=(), payment=()</text>
        <text x="0" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="0" dy="0">Explicitly revokes hardware access (mic, camera,</tspan>
          <tspan x="0" dy="13">geo) across main document &amp; embedded iframes.</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Col 3: Cookie Security & SameSite Attributes -->
  <g transform="translate(800, 310)">
    <rect width="350" height="420" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">COOKIE FLAGS &amp; SAMESITE DEFENSES</text>

    <g transform="translate(18, 52)">
      <!-- Standard Cookie String -->
      <rect width="314" height="42" rx="6" fill="#131a2c" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">Set-Cookie: session=xyz987; Secure;</text>
      <text x="10" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">HttpOnly; SameSite=Lax; Path=/; Max-Age=86400</text>

      <!-- Flags breakdown -->
      <g transform="translate(0, 56)">
        <!-- HttpOnly -->
        <g transform="translate(0, 0)">
          <text x="0" y="14" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">&#128274; HttpOnly</text>
          <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
            <tspan x="0" dy="0">Blocks JavaScript (<tspan fill="#e2e8f0">document.cookie</tspan>) from reading</tspan>
            <tspan x="0" dy="13">the token. Primary defense against XSS hijacking.</tspan>
          </text>
        </g>

        <!-- Secure -->
        <g transform="translate(0, 60)">
          <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">&#128270; Secure</text>
          <text x="0" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
            <tspan x="0" dy="0">Cookie is only transmitted across encrypted TLS/</tspan>
            <tspan x="0" dy="13">HTTPS connections. Never sent over HTTP.</tspan>
          </text>
        </g>

        <!-- SameSite Modes -->
        <g transform="translate(0, 120)">
          <text x="0" y="14" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">&#8644; SameSite Cross-Site Defenses (CSRF)</text>
          
          <rect x="0" y="24" width="314" height="48" rx="6" fill="#131a2c" />
          <text x="10" y="42" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">SameSite=Strict</text>
          <text x="10" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Cookie is never sent on cross-site requests, even following links.</text>

          <rect x="0" y="80" width="314" height="48" rx="6" fill="#131a2c" />
          <text x="10" y="98" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">SameSite=Lax (Modern Default)</text>
          <text x="10" y="114" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Sent on top-level GET links, withheld from cross-site POSTs.</text>

          <rect x="0" y="136" width="314" height="48" rx="6" fill="#131a2c" />
          <text x="10" y="154" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">SameSite=None</text>
          <text x="10" y="170" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Cross-site allowed (embeds). Mandatory Secure flag required!</text>
        </g>
      </g>
    </g>
  </g>
</svg>