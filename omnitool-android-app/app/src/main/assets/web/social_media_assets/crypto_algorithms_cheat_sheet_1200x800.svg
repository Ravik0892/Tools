<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="cryptoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="cryptoTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#cryptoBg)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="160" cy="140" r="180" fill="#10b981" opacity="0.05" />
  <circle cx="1060" cy="180" r="200" fill="#00f2fe" opacity="0.05" />

  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB • INFORMATION SECURITY</text>
    <text x="0" y="66" fill="url(#cryptoTitle)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">Modern Cryptography &amp; Ciphers Quick Reference</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Security classifications, key strengths, algorithm standards, and best practices for modern developers.</text>
  </g>

  <!-- 3 CRYPTO PILLARS (Y: 155 to 545) -->

  <!-- PILLAR 1: ONE-WAY HASHES -->
  <g transform="translate(50, 155)">
    <rect width="355" height="375" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 343 0 Q 355 0 355 12 L 355 38 L 0 38 Z" fill="#131b2e" />
    <circle cx="20" cy="19" r="4" fill="#10b981" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">1. CRYPTOGRAPHIC HASHES</text>

    <g transform="translate(18, 54)">
      <!-- SHA-256 -->
      <rect width="319" height="66" rx="7" fill="#121a2c" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="22" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">SHA-256</text>
      <text x="96" y="22" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">[SECURE &#8226; 256-bit]</text>
      <text x="14" y="42" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Standard for file verification, blockchain,</text>
      <text x="14" y="56" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">git commits, and digital signatures.</text>

      <!-- SHA-512 -->
      <g transform="translate(0, 76)">
        <rect width="319" height="66" rx="7" fill="#121a2c" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="22" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">SHA-512 / SHA-3</text>
        <text x="150" y="22" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">[MAX SECURITY]</text>
        <text x="14" y="42" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Fast on 64-bit hardware; immune to length</text>
        <text x="14" y="56" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">extension attacks (SHA-3 / Keccak).</text>
      </g>

      <!-- MD5 & SHA-1 -->
      <g transform="translate(0, 152)">
        <rect width="319" height="74" rx="7" fill="#24141c" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="22" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">MD5 &amp; SHA-1</text>
        <text x="120" y="22" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">[BROKEN / INSECURE]</text>
        <text x="14" y="42" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11">Collision attacks proven feasible!</text>
        <text x="14" y="58" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11">🚫 NEVER use for security or auth.</text>
      </g>

      <!-- Password Note -->
      <g transform="translate(0, 236)">
        <rect width="319" height="70" rx="7" fill="#161e31" stroke="#24304c" stroke-width="1" />
        <text x="14" y="20" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">💡 Password Hashing Standard:</text>
        <text x="14" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Always use salted, slow hashes:</text>
        <text x="14" y="58" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Argon2id &#8226; bcrypt &#8226; PBKDF2</text>
      </g>
    </g>
  </g>

  <!-- PILLAR 2: SYMMETRIC CIPHERS -->
  <g transform="translate(422, 155)">
    <rect width="355" height="375" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 343 0 Q 355 0 355 12 L 355 38 L 0 38 Z" fill="#131b2e" />
    <circle cx="20" cy="19" r="4" fill="#00f2fe" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">2. SYMMETRIC ENCRYPTION</text>

    <g transform="translate(18, 54)">
      <!-- AES-256-GCM -->
      <rect width="319" height="74" rx="7" fill="#0f202b" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">AES-256-GCM</text>
      <text x="125" y="22" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">[INDUSTRY GOLD STANDARD]</text>
      <text x="14" y="42" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Authenticated Encryption (AEAD). Provides</text>
      <text x="14" y="58" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">both confidentiality &amp; tamper-detection.</text>

      <!-- ChaCha20-Poly1305 -->
      <g transform="translate(0, 84)">
        <rect width="319" height="66" rx="7" fill="#121a2c" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">ChaCha20-Poly1305</text>
        <text x="180" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">[ULTRA FAST]</text>
        <text x="14" y="42" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Preferred stream cipher for mobile devices</text>
        <text x="14" y="56" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">without dedicated AES-NI hardware chips.</text>
      </g>

      <!-- AES-CBC Mode -->
      <g transform="translate(0, 160)">
        <rect width="319" height="74" rx="7" fill="#1c1620" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="22" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">AES-CBC Mode</text>
        <text x="135" y="22" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">[REQUIRES HMAC]</text>
        <text x="14" y="42" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Vulnerable to padding oracle attacks if</text>
        <text x="14" y="58" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11">not paired with HMAC authentication.</text>
      </g>

      <!-- Key Rule -->
      <g transform="translate(0, 244)">
        <rect width="319" height="62" rx="7" fill="#161e31" stroke="#24304c" stroke-width="1" />
        <text x="14" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">🔑 IV / Nonce Security Rule:</text>
        <text x="14" y="42" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">NEVER reuse the same Initialization Vector (IV)!</text>
      </g>
    </g>
  </g>

  <!-- PILLAR 3: ASYMMETRIC KEYPAIRS -->
  <g transform="translate(794, 155)">
    <rect width="356" height="375" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 344 0 Q 356 0 356 12 L 356 38 L 0 38 Z" fill="#131b2e" />
    <circle cx="20" cy="19" r="4" fill="#c084fc" />
    <text x="32" y="23" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">3. ASYMMETRIC (PUBLIC/PRIVATE)</text>

    <g transform="translate(18, 54)">
      <!-- RSA -->
      <rect width="320" height="74" rx="7" fill="#121a2c" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="22" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">RSA (2048 / 4096-bit)</text>
      <text x="14" y="42" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Universal compatibility for SSL/TLS, SSH,</text>
      <text x="14" y="58" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">and PGP. 2048-bit minimum; 4096 recommended.</text>

      <!-- ECDSA / Ed25519 -->
      <g transform="translate(0, 84)">
        <rect width="320" height="74" rx="7" fill="#18122c" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="22" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">Ed25519 &amp; ECDSA</text>
        <text x="155" y="22" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">[MODERN / FAST]</text>
        <text x="14" y="42" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Elliptic Curve: Tiny 256-bit keys deliver</text>
        <text x="14" y="58" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">equal security to 3072-bit RSA with 10x speed.</text>
      </g>

      <!-- Key Roles -->
      <g transform="translate(0, 168)">
        <rect width="320" height="138" rx="7" fill="#161e31" stroke="#24304c" stroke-width="1" />
        <text x="14" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Role Breakdown:</text>

        <text x="14" y="46" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">• Public Key:</text>
        <text x="14" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Shared openly. Encrypts data or verifies signatures.</text>

        <text x="14" y="88" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">• Private Key:</text>
        <text x="14" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Secret. Decrypts messages or signs authentications.</text>

        <text x="14" y="126" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">🔒 In OmniTool Hub, private keys stay in RAM.</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM RULES & BEST PRACTICES (Y: 550 to 745) -->
  <g transform="translate(50, 550)">
    <rect width="1100" height="195" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 36 L 0 36 Z" fill="#131b2e" />
    <circle cx="20" cy="18" r="4" fill="#10b981" />
    <text x="32" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">CORE RULES FOR APPLICATION SECURITY</text>

    <!-- 4 Security Directives -->
    <g transform="translate(20, 52)">
      <rect width="250" height="120" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="14" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">1. Salt All Hashes</text>
      <text x="14" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Never store raw hashes.</text>
      <text x="14" y="64" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">A unique cryptographic salt</text>
      <text x="14" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">defeats rainbow table &amp;</text>
      <text x="14" y="100" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">pre-computed dictionary attacks.</text>
    </g>

    <g transform="translate(290, 52)">
      <rect width="250" height="120" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="14" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">2. Use Authenticated AEAD</text>
      <text x="14" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Always select AES-GCM or</text>
      <text x="14" y="64" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">ChaCha20-Poly1305 over raw CBC.</text>
      <text x="14" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Guarantees data cannot be</text>
      <text x="14" y="100" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">silently modified in transit.</text>
    </g>

    <g transform="translate(560, 52)">
      <rect width="250" height="120" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="14" y="24" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">3. Hybrid Encryption</text>
      <text x="14" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Asymmetric keys (RSA/EC) are</text>
      <text x="14" y="64" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">slow for large files. Use them to</text>
      <text x="14" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">encrypt a random AES key, then</text>
      <text x="14" y="100" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">encrypt the file with AES.</text>
    </g>

    <g transform="translate(830, 52)">
      <rect width="250" height="120" rx="8" fill="#161e31" stroke="#24304c" stroke-width="1" />
      <text x="14" y="24" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">4. Browser Web Crypto</text>
      <text x="14" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">OmniTool Hub relies on native</text>
      <text x="14" y="64" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">window.crypto.subtle</text>
      <text x="14" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Ciphers run in compiled C++ code</text>
      <text x="14" y="100" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11">at raw CPU hardware speeds.</text>
    </g>
  </g>
</svg>
