      <text x="160" y="30" fill="#94a3b8" font-size="10" font-weight="800" text-anchor="middle">⏱️</text>
    </g>
  </g>

  <!-- ==================== TRACK 2: OMNITOOL HUB ARCHITECTURE (EMERALD / CYAN / SAFE) ==================== -->
  <g transform="translate(50, 350)">
    <!-- Container Box -->
    <rect width="1100" height="175" rx="14" fill="#0c1822" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.4" />

    <!-- Track Header -->
    <rect x="18" y="14" width="16" height="16" rx="8" fill="#10b981" fill-opacity="0.2" />
    <circle cx="26" cy="22" r="4" fill="#10b981" />
    <text x="44" y="26" fill="#6ee7b7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1">OMNITOOL HUB (CLIENT-SIDE BROWSER EXECUTION)</text>
    <text x="1075" y="26" fill="#10b981" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="end">🛡️ 100% PRIVATE • ZERO SERVERS</text>

    <!-- Step 1 -->
    <g transform="translate(30, 48)">
      <rect width="210" height="100" rx="10" fill="#101e2e" stroke="#134e4a" stroke-width="1" />
      <text x="16" y="28" fill="#38bdf8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 1: LOCAL BROWSER</text>
      <text x="16" y="52" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Open In-Browser Tab</text>
      <text x="16" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">File stays in local memory</text>
      <circle cx="185" cy="26" r="10" fill="#0284c7" fill-opacity="0.2" />
      <text x="185" y="30" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle">⚡</text>
    </g>

    <!-- Arrow 1 (Cyan/Emerald) -->
    <g transform="translate(252, 90)">
      <line x1="0" y1="0" x2="36" y2="0" stroke="#00f2fe" stroke-width="2.2" />
      <polygon points="36,-4 46,0 36,4" fill="#00f2fe" />
      <text x="20" y="-8" fill="#00f2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">LOCAL RAM</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(308, 48)">
      <rect width="220" height="100" rx="10" fill="#0d232c" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="16" y="28" fill="#00f2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 2: ZERO TRANSFER</text>
      <text x="16" y="52" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">🚫 0 Bytes Sent Online</text>
      <text x="16" y="74" fill="#67e8f9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">No network calls or APIs</text>
      <circle cx="195" cy="26" r="10" fill="#00f2fe" fill-opacity="0.2" />
      <text x="195" y="30" fill="#00f2fe" font-size="10" font-weight="800" text-anchor="middle">🔒</text>
    </g>

    <!-- Arrow 2 (Cyan/Emerald) -->
    <g transform="translate(540, 90)">
      <line x1="0" y1="0" x2="36" y2="0" stroke="#10b981" stroke-width="2.2" />
      <polygon points="36,-4 46,0 36,4" fill="#10b981" />
      <text x="20" y="-8" fill="#10b981" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">WASM / JS</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(596, 48)">
      <rect width="220" height="100" rx="10" fill="#0c2621" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.2" />
      <text x="16" y="28" fill="#10b981" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 3: HARDWARE ENGINE</text>
      <text x="16" y="52" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Web Workers &amp; WASM</text>
      <text x="16" y="74" fill="#6ee7b7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Computed by local CPU</text>
      <circle cx="195" cy="26" r="10" fill="#10b981" fill-opacity="0.2" />
      <text x="195" y="30" fill="#10b981" font-size="10" font-weight="800" text-anchor="middle">⚙️</text>
    </g>

    <!-- Arrow 3 (Cyan/Emerald) -->
    <g transform="translate(828, 90)">
      <line x1="0" y1="0" x2="36" y2="0" stroke="#10b981" stroke-width="2.2" />
      <polygon points="36,-4 46,0 36,4" fill="#10b981" />
      <text x="20" y="-8" fill="#10b981" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">INSTANT</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(884, 48)">
      <rect width="186" height="100" rx="10" fill="#08201a" stroke="#10b981" stroke-width="1.2" />
      <text x="16" y="28" fill="#10b981" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 4: OUTPUT</text>
      <text x="16" y="52" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Instant Download</text>
      <text x="16" y="74" fill="#a7f3d0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Memory cleared on close</text>
      <circle cx="160" cy="26" r="10" fill="#10b981" fill-opacity="0.2" />
      <text x="160" y="30" fill="#10b981" font-size="10" font-weight="800" text-anchor="middle">🚀</text>
    </g>
  </g>

  <!-- ==================== FOOTER BENEFIT CHIPS ==================== -->
  <g transform="translate(50, 545)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect width="250" height="38" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1" />
      <circle cx="20" cy="19" r="6" fill="#10b981" />
      <text x="36" y="23" fill="#e2e8f0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero Server Uploads (0 Bytes)</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(280, 0)">
      <rect width="250" height="38" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1" />
      <circle cx="20" cy="19" r="6" fill="#00f2fe" />
      <text x="36" y="23" fill="#e2e8f0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero Server Logs or Telemetry</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(560, 0)">
      <rect width="250" height="38" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1" />
      <circle cx="20" cy="19" r="6" fill="#9d4edd" />
      <text x="36" y="23" fill="#e2e8f0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">100% Offline-Capable (PWA)</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(840, 0)">
      <rect width="260" height="38" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1" />
      <circle cx="20" cy="19" r="6" fill="#f59e0b" />
      <text x="36" y="23" fill="#e2e8f0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Ultra-Low Latency Hardware Speed</text>
    </g>
  </g>
</svg>
