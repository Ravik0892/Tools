<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Risk Gradient -->
    <linearGradient id="riskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>

    <!-- Safe Gradient -->
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="160" fill="#00f2fe" opacity="0.06" filter="url(#softGlow)" />
  <circle cx="1050" cy="500" r="180" fill="#10b981" opacity="0.06" filter="url(#softGlow)" />
  <circle cx="950" cy="150" r="140" fill="#ef4444" opacity="0.04" filter="url(#softGlow)" />

  <!-- Outer Frame -->
  <rect x="25" y="25" width="1150" height="580" rx="20" fill="none" stroke="#1e2638" stroke-width="1.5" />

  <!-- ==================== HEADER ==================== -->
  <!-- Top Category Badge -->
  <g transform="translate(60, 52)">
    <rect width="270" height="28" rx="14" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <text x="135" y="18" fill="#00f2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1.5">100% PRIVATE • CLIENT-SIDE ARCHITECTURE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="112" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">How OmniTool Hub Protects Your Privacy &amp; Data</text>
  <text x="60" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">A technical comparison between traditional cloud converter websites and our zero-upload browser architecture.</text>

  <!-- ==================== TRACK 1: TRADITIONAL CLOUD CONVERTERS (RED / WARNING) ==================== -->
  <g transform="translate(50, 160)">
    <!-- Container Box -->
    <rect width="1100" height="175" rx="14" fill="#111522" fill-opacity="0.75" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- Track Header -->
    <rect x="18" y="14" width="16" height="16" rx="8" fill="#ef4444" fill-opacity="0.2" />
    <circle cx="26" cy="22" r="4" fill="#ef4444" />
    <text x="44" y="26" fill="#fca5a5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1">TRADITIONAL ONLINE CONVERTERS (CLOUD-BASED)</text>
    <text x="1075" y="26" fill="#f87171" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="end">⚠️ PRIVACY RISK &amp; QUEUES</text>

    <!-- Step 1 -->
    <g transform="translate(30, 48)">
      <rect width="210" height="100" rx="10" fill="#181c2b" stroke="#2a3349" stroke-width="1" />
      <text x="16" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 1: USER DEVICE</text>
      <text x="16" y="52" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Upload File / Input</text>
      <text x="16" y="74" fill="#64748b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">PDF, passwords, private data</text>
      <circle cx="185" cy="26" r="10" fill="#334155" fill-opacity="0.5" />
      <text x="185" y="30" fill="#94a3b8" font-size="10" font-weight="800" text-anchor="middle">💻</text>
    </g>

    <!-- Arrow 1 (Red) -->
    <g transform="translate(252, 90)">
      <line x1="0" y1="0" x2="36" y2="0" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
      <polygon points="36,-4 46,0 36,4" fill="#ef4444" />
      <text x="20" y="-8" fill="#f87171" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">UPLOAD</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(308, 48)">
      <rect width="220" height="100" rx="10" fill="#181c2b" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1" />
      <text x="16" y="28" fill="#f87171" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 2: PUBLIC TRANSIT</text>
      <text x="16" y="52" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Traverses Internet</text>
      <text x="16" y="74" fill="#fca5a5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Vulnerable to interception</text>
      <circle cx="195" cy="26" r="10" fill="#ef4444" fill-opacity="0.2" />
      <text x="195" y="30" fill="#f87171" font-size="10" font-weight="800" text-anchor="middle">🌐</text>
    </g>

    <!-- Arrow 2 (Red) -->
    <g transform="translate(540, 90)">
      <line x1="0" y1="0" x2="36" y2="0" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
      <polygon points="36,-4 46,0 36,4" fill="#ef4444" />
      <text x="20" y="-8" fill="#f87171" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">INGEST</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(596, 48)">
      <rect width="220" height="100" rx="10" fill="#1c1620" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1" />
      <text x="16" y="28" fill="#f87171" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 3: 3RD-PARTY CLOUD</text>
      <text x="16" y="52" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Remote Cloud Server</text>
      <text x="16" y="74" fill="#fca5a5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Saved on unknown disks</text>
      <circle cx="195" cy="26" r="10" fill="#ef4444" fill-opacity="0.2" />
      <text x="195" y="30" fill="#f87171" font-size="10" font-weight="800" text-anchor="middle">☁️</text>
    </g>

    <!-- Arrow 3 (Red) -->
    <g transform="translate(828, 90)">
      <line x1="0" y1="0" x2="36" y2="0" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
      <polygon points="36,-4 46,0 36,4" fill="#ef4444" />
      <text x="20" y="-8" fill="#f87171" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DOWNLOAD</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(884, 48)">
      <rect width="186" height="100" rx="10" fill="#181c2b" stroke="#2a3349" stroke-width="1" />
      <text x="16" y="28" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 4: RESULT</text>
