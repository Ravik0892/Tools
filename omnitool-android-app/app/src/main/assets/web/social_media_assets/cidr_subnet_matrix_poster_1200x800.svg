<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="cidrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <linearGradient id="cidrTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#cidrBg)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="160" cy="140" r="180" fill="#38bdf8" opacity="0.05" />
  <circle cx="1060" cy="180" r="200" fill="#818cf8" opacity="0.05" />

  <rect x="24" y="24" width="1152" height="752" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(50, 48)">
    <rect width="250" height="26" rx="13" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="125" y="17" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">OMNITOOL HUB • NETWORK ARCHITECTURE</text>
    <text x="0" y="66" fill="url(#cidrTitle)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">IPv4 Subnetting &amp; CIDR Prefix Reference Matrix</text>
    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">Quick-lookup table for masks, wildcard offsets, address capacities, and private RFC 1918 network ranges.</text>
  </g>

  <!-- MAIN CIDR TABLE (/24 to /32) (Y: 155 to 545) -->
  <g transform="translate(50, 155)">
    <rect width="1100" height="375" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />

    <!-- Table Header Row -->
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 38 L 0 38 Z" fill="#131b2e" />
    <text x="30" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">CIDR</text>
    <text x="120" y="24" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">SUBNET MASK</text>
    <text x="330" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">WILDCARD MASK</text>
    <text x="540" y="24" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">TOTAL IPS</text>
    <text x="690" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">USABLE HOSTS</text>
    <text x="860" y="24" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">TYPICAL USE CASE</text>

    <!-- Table Rows -->
    <!-- /24 -->
    <g transform="translate(0, 38)">
      <rect width="1100" height="36" fill="#101726" fill-opacity="0.5" />
      <text x="30" y="23" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">/24</text>
      <text x="120" y="23" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">255.255.255.0</text>
      <text x="330" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">0.0.0.255</text>
      <text x="540" y="23" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">256</text>
      <text x="690" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">254</text>
      <text x="860" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Standard Local LAN / Class C</text>
    </g>

    <!-- /25 -->
    <g transform="translate(0, 74)">
      <line x1="20" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="0.7" />
      <text x="30" y="23" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">/25</text>
      <text x="120" y="23" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">255.255.255.128</text>
      <text x="330" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">0.0.0.127</text>
      <text x="540" y="23" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">128</text>
      <text x="690" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">126</text>
      <text x="860" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Large Subnet Split</text>
    </g>

    <!-- /26 -->
    <g transform="translate(0, 110)">
      <line x1="20" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="0.7" />
      <text x="30" y="23" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">/26</text>
      <text x="120" y="23" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">255.255.255.192</text>
      <text x="330" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">0.0.0.63</text>
      <text x="540" y="23" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">64</text>
      <text x="690" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">62</text>
      <text x="860" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Mid Department / Office Block</text>
    </g>

    <!-- /27 -->
    <g transform="translate(0, 146)">
      <line x1="20" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="0.7" />
      <text x="30" y="23" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">/27</text>
      <text x="120" y="23" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">255.255.255.224</text>
      <text x="330" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">0.0.0.31</text>
      <text x="540" y="23" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">32</text>
      <text x="690" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">30</text>
      <text x="860" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Kubernetes Pod / Small Cluster</text>
    </g>

    <!-- /28 -->
    <g transform="translate(0, 182)">
      <line x1="20" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="0.7" />
      <text x="30" y="23" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">/28</text>
      <text x="120" y="23" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">255.255.255.240</text>
      <text x="330" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">0.0.0.15</text>
      <text x="540" y="23" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">16</text>
      <text x="690" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">14</text>
      <text x="860" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Small VPC Subnet / DMZ</text>
    </g>

    <!-- /29 -->
    <g transform="translate(0, 218)">
      <line x1="20" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="0.7" />
      <text x="30" y="23" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">/29</text>
      <text x="120" y="23" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">255.255.255.248</text>
      <text x="330" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">0.0.0.7</text>
      <text x="540" y="23" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">8</text>
      <text x="690" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">6</text>
      <text x="860" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Small Public Static IP Pool</text>
    </g>

    <!-- /30 -->
    <g transform="translate(0, 254)">
      <line x1="20" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="0.7" />
      <text x="30" y="23" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">/30</text>
      <text x="120" y="23" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">255.255.255.252</text>
      <text x="330" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">0.0.0.3</text>
      <text x="540" y="23" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">4</text>
      <text x="690" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">2</text>
      <text x="860" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Classic Point-to-Point Router Link</text>
    </g>

    <!-- /31 -->
    <g transform="translate(0, 290)">
      <line x1="20" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="0.7" />
      <text x="30" y="23" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">/31</text>
      <text x="120" y="23" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">255.255.255.254</text>
      <text x="330" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">0.0.0.1</text>
      <text x="540" y="23" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">2</text>
      <text x="690" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">2 <tspan fill="#94a3b8" font-size="10">(RFC 3021)</tspan></text>
      <text x="860" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Modern Router P2P Links</text>
    </g>

    <!-- /32 -->
    <g transform="translate(0, 326)">
      <line x1="20" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="0.7" />
      <text x="30" y="23" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">/32</text>
      <text x="120" y="23" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="12">255.255.255.255</text>
      <text x="330" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">0.0.0.0</text>
      <text x="540" y="23" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">1</text>
      <text x="690" y="23" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">1</text>
      <text x="860" y="23" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Single Host Route / Loopback</text>
    </g>
  </g>

  <!-- BOTTOM REFERENCE: RFC 1918 & FORMULA (Y: 550 to 745) -->
  <g transform="translate(50, 550)">
    <!-- RFC 1918 Ranges Box -->
    <g transform="translate(0, 0)">
      <rect width="680" height="195" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
      <path d="M 0 12 Q 0 0 12 0 L 668 0 Q 680 0 680 12 L 680 36 L 0 36 Z" fill="#131b2e" />
      <circle cx="20" cy="18" r="4" fill="#38bdf8" />
      <text x="32" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">RFC 1918 PRIVATE IP ALLOCATIONS (NON-ROUTABLE ON INTERNET)</text>

      <g transform="translate(20, 52)">
        <text x="0" y="14" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700">10.0.0.0 /8</text>
        <text x="130" y="14" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">10.0.0.0 – 10.255.255.255</text>
        <text x="360" y="14" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11.5">16,777,216 IPs</text>
        <text x="500" y="14" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Enterprise Cloud VPCs</text>

        <text x="0" y="44" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700">172.16.0.0 /12</text>
        <text x="130" y="44" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">172.16.0.0 – 172.31.255.255</text>
        <text x="360" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11.5">1,048,576 IPs</text>
        <text x="500" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Docker / Data Centers</text>

        <text x="0" y="74" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700">192.168.0.0 /16</text>
        <text x="130" y="74" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">192.168.0.0 – 192.168.255.255</text>
        <text x="360" y="74" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11.5">65,536 IPs</text>
        <text x="500" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Home &amp; Office LANs</text>

        <text x="0" y="104" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700">127.0.0.0 /8</text>
        <text x="130" y="104" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">127.0.0.1 – 127.255.255.254</text>
        <text x="360" y="104" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11.5">Loopback</text>
        <text x="500" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Localhost Testing</text>
      </g>
    </g>

    <!-- Usable Formula & Rules Box -->
    <g transform="translate(705, 0)">
      <rect width="395" height="195" rx="12" fill="#0d121f" stroke="#1e293b" stroke-width="1.2" />
      <path d="M 0 12 Q 0 0 12 0 L 383 0 Q 395 0 395 12 L 395 36 L 0 36 Z" fill="#131b2e" />
      <circle cx="20" cy="18" r="4" fill="#10b981" />
      <text x="32" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">THE GOLDEN SUBNET FORMULA</text>

      <g transform="translate(18, 52)">
        <text x="0" y="14" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Total Host Capacity:</text>
        <rect x="0" y="24" width="355" height="28" rx="6" fill="#161e31" stroke="#24304c" stroke-width="1" />
        <text x="12" y="43" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Total IPs = 2^(32 - Prefix)</text>

        <text x="0" y="76" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Usable Usable Hosts:</text>
        <rect x="0" y="86" width="355" height="28" rx="6" fill="#161e31" stroke="#24304c" stroke-width="1" />
        <text x="12" y="105" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Usable Hosts = (Total IPs) - 2</text>

        <text x="0" y="132" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11">(-2 reserves First: Network ID &amp; Last: Broadcast)</text>
      </g>
    </g>
  </g>
</svg>
