<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Outer Protective Frame -->
  <rect x="24" y="24" width="1152" height="752" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- HEADER REGION (Y: 44 to 125) -->
  <g transform="translate(50, 44)">
    <!-- Badge -->
    <rect width="320" height="22" rx="11" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="11" cy="11" r="4" fill="#00f2fe" />
    <text x="22" y="15" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">OMNITOOL HUB &#8226; WRITERS &amp; PARSERS</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">MULTI-PDF SEARCH &amp; CLIENT-SIDE OCR ENGINE</text>

    <!-- Subtitle -->
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">PDF Document Streams, Text Layer Extraction, Tesseract WASM, and Inverted Search Indices</text>
  </g>

  <!-- TOP OVERVIEW REGION (Y: 135 to 295) -->
  <g transform="translate(50, 135)">
    <rect width="1100" height="155" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    
    <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 32 L 0 32 Z" fill="#131a2c" />
    <text x="20" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">CLIENT-SIDE PDF TEXT EXTRACTION &amp; OCR ARCHITECTURE</text>

    <!-- 4 Pipeline Stages -->
    <g transform="translate(24, 46)">
      <!-- Stage 1 -->
      <g transform="translate(0, 0)">
        <rect width="240" height="92" rx="8" fill="#131a2c" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="20" cy="20" r="10" fill="#0369a1" />
        <text x="20" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">1</text>
        <text x="38" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Binary Document Ingestion</text>
        <text x="12" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">&#8226; ArrayBuffer in local RAM</tspan>
          <tspan x="12" dy="14">&#8226; PDF.js parses cross-reference table</tspan>
          <tspan x="12" dy="14">&#8226; Zero server network upload</tspan>
        </text>
      </g>

      <!-- Arrow 1 -->
      <path d="M 248 46 L 268 46" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
      <polygon points="268,42 276,46 268,50" fill="#475569" />

      <!-- Stage 2 -->
      <g transform="translate(284, 0)">
        <rect width="240" height="92" rx="8" fill="#131a2c" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="20" cy="20" r="10" fill="#b45309" />
        <text x="20" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">2</text>
        <text x="38" y="24" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Text Layer Detection</text>
        <text x="12" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">&#8226; Inspects vector glyph operators</tspan>
          <tspan x="12" dy="14">&#8226; Fast path: Extract embedded text</tspan>
          <tspan x="12" dy="14">&#8226; Fallback: Trigger Tesseract WASM</tspan>
        </text>
      </g>

      <!-- Arrow 2 -->
      <polygon points="532,42 540,46 532,50" fill="#475569" />

      <!-- Stage 3 -->
      <g transform="translate(548, 0)">
        <rect width="240" height="92" rx="8" fill="#131a2c" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="20" cy="20" r="10" fill="#6b21a8" />
        <text x="20" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">3</text>
        <text x="38" y="24" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">WASM OCR Preprocessing</text>
        <text x="12" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">&#8226; Canvas 300 DPI binarization</tspan>
          <tspan x="12" dy="14">&#8226; Adaptive Otsu thresholding</tspan>
          <tspan x="12" dy="14">&#8226; Web Worker multi-thread parse</tspan>
        </text>
      </g>

      <!-- Arrow 3 -->
      <polygon points="796,42 804,46 796,50" fill="#475569" />

      <!-- Stage 4 -->
      <g transform="translate(812, 0)">
        <rect width="240" height="92" rx="8" fill="#131a2c" stroke="#34d399" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="20" cy="20" r="10" fill="#047857" />
        <text x="20" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">4</text>
        <text x="38" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Inverted Index &amp; Match</text>
        <text x="12" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
          <tspan x="12" dy="0">&#8226; Tokenize words &amp; character offsets</tspan>
          <tspan x="12" dy="14">&#8226; Sub-millisecond regex &amp; phrase</tspan>
          <tspan x="12" dy="14">&#8226; Highlight matches across pages</tspan>
        </text>
      </g>
    </g>
    
  </g>

  <!-- 3 CORE COLUMNS REGION (Y: 308 to 745) -->
  <!-- COLUMN 1 -->
  <g transform="translate(50, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="32" y="23" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PDF STREAM ARCHITECTURE</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Vector Text vs Scanned Raster</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Digital PDFs store selectable text via font glyph</tspan>
        <tspan x="0" dy="13">operators (Tj, TJ). Scanned documents wrap</tspan>
        <tspan x="0" dy="13">raw images without characters until OCR runs.</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. PDF.js Stream Decompression</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">PDF page streams are compressed with Flate (zlib).</tspan>
        <tspan x="0" dy="13">PDF.js decodes stream bytes in background workers,</tspan>
        <tspan x="0" dy="13">preventing main-thread browser freezing.</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 160)">
      <text x="0" y="14" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Font CMap &amp; Encoding Maps</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Custom embedded fonts map character codes to</tspan>
        <tspan x="0" dy="13">ToUnicode CMaps. When CMaps are corrupted,</tspan>
        <tspan x="0" dy="13">extracted text appears as scrambled gibberish.</tspan>
      </text>
    </g>

    <!-- Card Alert -->
    <g transform="translate(0, 240)">
      <rect width="314" height="130" rx="8" fill="#131a2c" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#128274; 100% Client-Side RAM Processing</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Sensitive legal contracts, medical charts, and</tspan>
        <tspan x="12" dy="13">tax returns are parsed strictly in local memory.</tspan>
        <tspan x="12" dy="13">&#8226; Zero server uploads</tspan>
        <tspan x="12" dy="13">&#8226; Zero third-party telemetry</tspan>
        <tspan x="12" dy="13">&#8226; Immediate garbage collection on close</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 2 -->
  <g transform="translate(425, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#fbbf24" />
    <text x="32" y="23" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">TESSERACT WASM OCR</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Tesseract WebAssembly Core</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Compiled C++ Tesseract engine runs in a dedicated</tspan>
        <tspan x="0" dy="13">Web Worker thread. Uses neural network LSTM models</tspan>
        <tspan x="0" dy="13">to recognize text across 100+ languages.</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Pre-OCR Image Binarization</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Converts RGB image to 1-bit high-contrast black</tspan>
        <tspan x="0" dy="13">&amp; white using Otsu thresholding. Eliminates</tspan>
        <tspan x="0" dy="13">background shadows, noise, and bleed-through.</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 160)">
      <text x="0" y="14" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Resolution &amp; DPI Threshold</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">OCR requires 300 DPI (approx 2480x3508 for A4).</tspan>
        <tspan x="0" dy="13">72 DPI screen renders cause severe accuracy loss</tspan>
        <tspan x="0" dy="13">on small fonts (8pt&#8211;10pt) and punctuation.</tspan>
      </text>
    </g>

    <!-- Card Tip -->
    <g transform="translate(0, 240)">
      <rect width="314" height="130" rx="8" fill="#131a2c" stroke="#d97706" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9888; OCR Confidence Scoring</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Every extracted word outputs a confidence score</tspan>
        <tspan x="12" dy="13">from 0 to 100%. OmniTool filters matches:</tspan>
        <tspan x="12" dy="13">&#8226; 85&#8211;100%: High accuracy text</tspan>
        <tspan x="12" dy="13">&#8226; 60&#8211;84%: Moderate (faded ink or skew)</tspan>
        <tspan x="12" dy="13">&#8226; &lt; 60%: Low (flagged for review)</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- COLUMN 3 -->
  <g transform="translate(800, 308)">
    <rect width="350" height="437" rx="12" fill="#0d121f" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 38 L 0 38 Z" fill="#131a2c" />
    <circle cx="20" cy="19" r="4" fill="#34d399" />
    <text x="32" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">SEARCH ALGORITHMS &amp; INDEX</text>
    <g transform="translate(18, 50)">
      
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Inverted Search Index (Fast Match)</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Maps each word token to exact page coordinates:</tspan>
        <tspan x="0" dy="13"><tspan fill="#f8fafc">term &#8594; [{docId, page, x, y, width, height}]</tspan></tspan>
        <tspan x="0" dy="13">Enables instant multi-PDF search without re-scans.</tspan>
      </text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Regex &amp; Proximity Search</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">Supports complex regular expressions across</tspan>
        <tspan x="0" dy="13">document streams (e.g. invoice numbers, SSNs,</tspan>
        <tspan x="0" dy="13">dates) and exact multi-word phrase matching.</tspan>
      </text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 160)">
      <text x="0" y="14" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Bounded Memory Streaming</text>
      <text x="0" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="0" dy="0">For 500+ page documents, pages are rendered and</tspan>
        <tspan x="0" dy="13">indexed in rolling batches of 10 to keep browser</tspan>
        <tspan x="0" dy="13">memory usage below 250MB total RAM.</tspan>
      </text>
    </g>

    <!-- Card Pro Tip -->
    <g transform="translate(0, 240)">
      <rect width="314" height="130" rx="8" fill="#131a2c" stroke="#059669" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">&#9733; Instant PDF Highlight Overlays</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Match bounding boxes are translated via CTM to</tspan>
        <tspan x="12" dy="13">canvas viewport pixels. Yellow highlight overlays</tspan>
        <tspan x="12" dy="13">are rendered on top of original pages for</tspan>
        <tspan x="12" dy="13">instant visual discovery.</tspan>
      </text>
    </g>
    
    </g>
  </g>

  <!-- FOOTER BRANDING (Y: 760) -->
  <text x="600" y="764" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">OMNITOOL HUB CLIENT-SIDE SUITE &#8226; 100% PRIVATE &#8226; ZERO DATA TRANSMISSION &#8226; WEB STANDARDS COMPLIANT</text>
</svg>